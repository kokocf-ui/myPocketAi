name: Eva creative live quality canary

on:
  push:
    branches:
      - feature/eva-creative-quality-20261119
    paths:
      - 'scripts/eva-creative-live-canary.mjs'
      - '.github/workflows/eva-creative-live-canary.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eva-creative-live-canary-20261119
  cancel-in-progress: false

jobs:
  compare-creative-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify creative routing before real model calls
        run: |
          node --check scripts/eva-creative-live-canary.mjs
          node tests_eva_creative_quality.mjs
          node tests_eva_creative_backend.mjs
      - name: Request three bounded synthetic creative outputs
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_AI_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}
        run: node scripts/eva-creative-live-canary.mjs
      - name: Upload writing samples for manual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eva-creative-live-quality-results
          path: reports/eva-creative-canary.*
          if-no-files-found: warn
          retention-days: 7

name: Romania urban GTFS route tests
on:
  push:
    paths:
      - 'transport_route_topology.mjs'
      - 'tests_transport_route_topology.mjs'
      - 'ro_urban_gtfs.mjs'
      - 'ro_urban_gtfs_import.mjs'
      - 'ro_urban_server.mjs'
      - 'ro_urban_client.mjs'
      - 'en_urban_client.mjs'
      - 'regional_gtfs_registry.mjs'
      - 'regional_gtfs_catalog.mjs'
      - 'gtfs_sqlite_reader.mjs'
      - 'gtfs_sqlite_store.py'
      - 'tests_gtfs_stop_distance.py'
      - 'oracle-romania-transport/audit-stop-distances.py'
      - 'tests_gtfs_sqlite_indexed.mjs'
      - 'tests_regional_gtfs_end_to_end.mjs'
      - 'oracle-england-transport/**'
      - 'ro_urban_walking.mjs'
      - 'transit_transfer_walking.mjs'
      - 'tests_transit_transfer_walking.mjs'
      - 'backend.js'
      - 'tests_ro_urban_gtfs.mjs'
      - 'tests_ro_urban_server.mjs'
      - 'tests_ro_urban_client.mjs'
      - 'tests_ro_urban_walking.mjs'
      - 'oracle-romania-transport/**'
      - '.github/workflows/test-ro-urban-gtfs.yml'
  pull_request:
    paths:
      - 'transport_route_topology.mjs'
      - 'tests_transport_route_topology.mjs'
      - 'ro_urban_gtfs.mjs'
      - 'ro_urban_gtfs_import.mjs'
      - 'ro_urban_server.mjs'
      - 'ro_urban_client.mjs'
      - 'en_urban_client.mjs'
      - 'regional_gtfs_registry.mjs'
      - 'regional_gtfs_catalog.mjs'
      - 'gtfs_sqlite_reader.mjs'
      - 'gtfs_sqlite_store.py'
      - 'tests_gtfs_stop_distance.py'
      - 'oracle-romania-transport/audit-stop-distances.py'
      - 'tests_gtfs_sqlite_indexed.mjs'
      - 'tests_regional_gtfs_end_to_end.mjs'
      - 'oracle-england-transport/**'
      - 'ro_urban_walking.mjs'
      - 'backend.js'
      - 'tests_ro_urban_gtfs.mjs'
      - 'tests_ro_urban_server.mjs'
      - 'tests_ro_urban_client.mjs'
      - 'tests_ro_urban_walking.mjs'
      - 'oracle-romania-transport/**'
      - '.github/workflows/test-ro-urban-gtfs.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check ro_urban_gtfs.mjs && node --check ro_urban_gtfs_import.mjs && node --check ro_urban_server.mjs && node --check ro_urban_client.mjs && node --check en_urban_client.mjs && node --check regional_gtfs_registry.mjs && node --check regional_gtfs_catalog.mjs && node --check gtfs_sqlite_reader.mjs && node --check oracle-romania-transport/probe-gtfs.mjs && node --check oracle-romania-transport/build-index.mjs && node --check ro_urban_walking.mjs && node --check transit_transfer_walking.mjs && node --check backend.js
      - run: python3 tests_gtfs_stop_distance.py
      - run: node --test tests_transport_route_topology.mjs tests_ro_urban_gtfs.mjs tests_ro_urban_server.mjs tests_ro_urban_client.mjs tests_ro_urban_walking.mjs tests_transit_transfer_walking.mjs tests_regional_gtfs_end_to_end.mjs tests_gtfs_sqlite_indexed.mjs

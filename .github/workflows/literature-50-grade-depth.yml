name: Literature 50-country grade depth
on:
  pull_request:
    paths:
      - 'literature_*.mjs'
      - 'tests_literature_*.mjs'
      - 'tests_education_source_translation.mjs'
      - 'education_country_ui.mjs'
      - 'backend.js'
      - 'index.js'
      - 'scripts/audit_literature_readiness.mjs'
      - 'scripts/build_literature_profiles.mjs'
      - 'scripts/build_literature_authored_packs.mjs'
      - 'scripts/build_literature_national_packs.mjs'
      - 'education_pack_service.mjs'
      - 'public/education/literature/profiles/**'
      - 'public/education/literature/authored/**'
      - 'public/education/history/authored/**'
      - 'public/education/geography/authored/**'
      - 'public/education/computing/authored/**'
      - 'public/education/math/authored/**'
      - 'math_national_packs.mjs'
      - 'math_country_grade_areas.mjs'
      - 'tests_math_national_packs.mjs'
      - 'public/education/physics/authored/**'
      - 'public/education/chemistry/authored/**'
      - 'public/education/biology/authored/**'
      - 'science_national_packs.mjs'
      - 'tests_science_national_packs.mjs'
      - 'computing_national_packs.mjs'
      - 'computing_ui.mjs'
      - 'education_national_subject_packs.mjs'
      - 'tests_history_national_packs.mjs'
      - 'tests_geography_national_packs.mjs'
      - 'tests_computing_national_packs.mjs'
      - 'education_all_country_subject_matrix.mjs'
      - '.github/workflows/literature-50-grade-depth.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  grade-curriculum:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks
        run: |
          node --check literature_curriculum_europe.mjs
          node --check literature_europe_grade_expansion.mjs
          node --check tests_literature_all_country_depth.mjs
          node --check tests_literature_selected_stage_2026.mjs
          node --check literature_europe_practice.mjs
          node --check literature_general_fallback.mjs
          node --check tests_literature_chapter_activities_2026.mjs
          node --check literature_hungary_grade1.mjs
          node --check tests_literature_hungary_grade1.mjs
          node --check literature_hungary_primary_batch.mjs
          node --check tests_literature_hungary_primary_batch.mjs
          node --check scripts/audit_literature_readiness.mjs
          node --check tests_literature_readiness_gate.mjs
          node --check literature_europe_authored_material.mjs
          node --check literature_europe_client_lazy.mjs
          node --check tests_literature_compact_html.mjs
          node --check literature_compact_catalog.mjs
          node --check tests_literature_compact_catalog.mjs
          node --check literature_quick_reference.mjs
          node --check literature_quick_reference_ui.mjs
          node --check tests_literature_quick_reference.mjs
          node --check literature_ro_expanded_years.mjs
          node --check literature_university_years.mjs
          node --check tests_literature_android_corrections.mjs
          node --check literature_reference_catalog.mjs
          node --check tests_literature_real_browser.mjs
          node --check tests_literature_national_browser.mjs
          node --check tests_literature_reference_catalog.mjs
          node --check tests_literature_europe_authored_material.mjs
      - name: National coverage and existing literature regressions
        run: |
          node scripts/build_literature_profiles.mjs --verify
          node scripts/build_literature_authored_packs.mjs --verify
          node scripts/build_literature_national_packs.mjs
          node scripts/build_literature_national_packs.mjs --subject=history
          node tests_history_national_packs.mjs
          node scripts/build_literature_national_packs.mjs --subject=geography
          node tests_geography_national_packs.mjs
          node scripts/build_literature_national_packs.mjs --subject=computing
          node tests_computing_national_packs.mjs
          node scripts/build_literature_national_packs.mjs --subject=math
          node tests_math_national_packs.mjs
          node scripts/build_literature_national_packs.mjs --subject=biology
          node scripts/build_literature_national_packs.mjs --subject=physics
          node scripts/build_literature_national_packs.mjs --subject=chemistry
          node tests_science_national_packs.mjs
          node tests_literature_national_packs.mjs
          node tests_literature_country_profiles.mjs
          node tests_literature_authored_packs.mjs
          node tests_literature_france_cp.mjs
          node tests_education_source_translation.mjs
          node tests_literature_all_country_depth.mjs
          node tests_literature_selected_stage_2026.mjs
          node tests_literature_chapter_activities_2026.mjs
          node tests_literature_hungary_grade1.mjs
          node tests_literature_hungary_primary_batch.mjs
          node tests_literature_readiness_gate.mjs
          node tests_literature_europe_authored_material.mjs
          node tests_literature_compact_html.mjs
          node tests_literature_compact_catalog.mjs
          node tests_literature_quick_reference.mjs
          node tests_literature_android_corrections.mjs
          node tests_literature_reference_catalog.mjs
          node tests_literature_real_browser.mjs
          node tests_literature_national_browser.mjs
          node tests_literature_europe.mjs
          node tests_literature_ro_grade_progression.mjs
          node tests_seven_europe_literature.mjs
          node tests_literature_completion.mjs

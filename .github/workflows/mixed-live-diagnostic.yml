name: Diagnose international mixed flight search

on:
  # No transport provider probes on unrelated deployments.
  workflow_dispatch:
    inputs:
      run_live:
        description: 'Use free flight search credits for one explicit live request'
        required: false
        default: false
        type: boolean

      inspect_open_gtfs:
        description: 'Inspect the official open FlixBus/FlixTrain GTFS; no transport API credits or deploy'
        required: false
        default: false
        type: boolean

      probe_local_connections:
        description: 'Two ordinary domestic transit checks at open-GTFS endpoints; no flight/Exa/Brave/HERE searches'
        required: false
        default: false
        type: boolean

jobs:
  live-mixed:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        if: inputs.inspect_open_gtfs == true
      - name: Inspect official open European surface feed (no paid API)
        if: inputs.inspect_open_gtfs == true
        env:
          PROBE_LOCAL: ${{ inputs.probe_local_connections }}
        run: |
          EXTRA=()
          if [ "$PROBE_LOCAL" = 'true' ]; then EXTRA+=(--probe-local); fi
          python3 scripts/inspect_open_surface_gtfs.py --origin 51.475 0.325 --destination 47.0612 21.9473 --departure-at 2026-12-03T06:00:00Z --output "$RUNNER_TEMP/open-surface-proof.json" "${EXTRA[@]}"
      - name: Preserve public synthetic source and endpoint evidence
        if: always() && inputs.inspect_open_gtfs == true
        uses: actions/upload-artifact@v4
        with:
          name: open-surface-proof
          path: ${{ runner.temp }}/open-surface-proof.json
          retention-days: 7
          if-no-files-found: ignore
      - name: Inspect binding presence, runtime analytics and no-credit flight health
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'JS'
          const token=process.env.CLOUDFLARE_API_TOKEN,account=process.env.CLOUDFLARE_ACCOUNT_ID;
          const notice=(title,value)=>console.log('::notice title='+title+'::'+JSON.stringify(value).replace(/%/g,'%25').replace(/\r/g,'%0D').replace(/\n/g,'%0A'));
          const headers={Authorization:'Bearer '+token,'Content-Type':'application/json'};
          const cf=async(path,options={})=>{
            const r=await fetch('https://api.cloudflare.com/client/v4/'+path,{...options,headers,signal:AbortSignal.timeout(20000)});
            const body=await r.json();
            if(!r.ok||body.success===false){notice('runtime-api-status',{http:r.status,codes:body.errors?.map(e=>e.code)});return null}
            return body;
          };
          const settings=await cf('accounts/'+account+'/workers/scripts/lifewise-ai-api/settings');
          if(settings?.result){
            const bindings=settings.result.bindings||[];
            const names=['GEOAPIFY_API_KEY','EXA_API_KEY','BRAVE_API_KEY','SERPAPI_API_KEY','TFL_APP_KEY','TRANSCAPI_API_KEY','MOTIS_API_BASE_URL','RO_URBAN_API_TOKEN','RO_URBAN_VPC'];
            const flags=['SERPAPI_FLIGHTS_PILOT_ENABLED','SERPAPI_FLIGHTS_TERMS_REVIEWED','HERE_TRANSIT_ENABLED','SMART_COUNTRY_REGISTRY_ENABLED'];
            notice('transport-binding-presence',Object.fromEntries(names.map(name=>[name,bindings.some(b=>b.name===name)])));
            notice('transport-runtime-flags',Object.fromEntries(flags.map(name=>[name,String(bindings.find(b=>b.name===name)?.text||'unset')])));
            notice('transport-runtime-limits',{cpu_ms:settings.result.limits?.cpu_ms??null,usage_model:settings.result.usage_model??null,observability_enabled:settings.result.observability?.enabled??null});
          }
          const since=new Date(Date.now()-3600000).toISOString(),until=new Date().toISOString();
          const query=`query { viewer { accounts(filter: {accountTag: "${account}"}) { workersInvocationsAdaptive(limit: 20, filter: {datetime_geq: "${since}", datetime_leq: "${until}", scriptName: "lifewise-ai-api"}) { dimensions { status } sum { requests errors subrequests } } } } }`;
          const analytics=await cf('graphql',{method:'POST',body:JSON.stringify({query})});
          if(analytics?.data)notice('transport-worker-hourly-outcomes',analytics.data.viewer?.accounts?.[0]?.workersInvocationsAdaptive||[]);
          else if(analytics?.errors)notice('transport-analytics-unavailable',{codes:analytics.errors.map(e=>e.extensions?.code||'query_failed')});
          try{
            const r=await fetch('https://lifewise-ai-v2.kokocf.workers.dev/api/flight-source-status?probe=1',{headers:{Accept:'application/json'},signal:AbortSignal.timeout(20000)});
            const health=await r.json();
            notice('flight-no-credit-health',{http:r.status,...Object.fromEntries(['status','keyConfigured','pilotEnabled','termsReviewed','pilotConfigured','freePlan','hasQuota','flightSearchActive','consumesSearchCredits'].map(k=>[k,health[k]??null]))});
          }catch{notice('flight-no-credit-health',{status:'health_endpoint_unreachable'})}
          JS
      - name: Request one live synthetic UK to Romania mixed journey
        if: github.event_name == 'workflow_dispatch' && inputs.run_live == true
        run: |
          python3 - <<'PY'
          import json,urllib.request,urllib.error,time
          dest={'latitude':47.0612,'longitude':21.9473,'label':'Strada Nufărului 1, 410100 Oradea, Romania','country_code':'RO'}
          origin={'latitude':51.475,'longitude':0.325,'label':'Grays, England, UK','country_code':'GB'}
          payload={
            'message':'Caută transport mixt către '+dest['label'],
            'language':'ro','history':[],'module':'travel',
            'mixed_journey':True,'mixed_composition':True,
            'transit_query':dest['label'],'transit_destination':dest,
            'journey_origin':origin,'transit_preference':'all',
            'location':origin,'location_requested':True,
            'travel_mode':'transit','transit_departure_at':None,
            'requested_transit_count':6
          }
          request=urllib.request.Request(
            'https://lifewise-ai-v2.kokocf.workers.dev/api/chat',
            data=json.dumps(payload).encode(),headers={'Content-Type':'application/json','User-Agent':'Mozilla/5.0 (Linux; Android 10) AppleWebKit/537.36 Chrome/125.0 Safari/537.36','Accept':'application/json'},method='POST')
          try:
              with urllib.request.urlopen(request,timeout=80) as response:
                  body=json.load(response)
                  print('Mixed HTTP',response.status)
                  print('Result:',json.dumps({k:body.get(k) for k in (
                    'status','reason','international_journey','mixed_journey',
                    'flight_search_status','flight_dates_checked','provider_status',
                    'transit_available','route_available')},ensure_ascii=False))
                  print('Flight candidates:',len(body.get('flight_candidates') or []))
                  print('Transit options:',len(body.get('transit') or []))
                  print('Reply excerpt:',str(body.get('reply',''))[:350])
          except urllib.error.HTTPError as exc:
              print('Mixed HTTP error:',exc.code,str(exc.read(300)))
          except Exception as exc:
              print('Mixed request failed:',str(exc)[:260])
          PY

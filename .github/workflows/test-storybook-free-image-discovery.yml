name: Storybook free-image discovery regressions

on:
  push:
    branches: [feature/storybook-free-image-discovery-20261120]
    paths:
      - 'storybook_commons_photos.mjs'
      - 'storybook_motion_ui.mjs'
      - 'tests_storybook_commons_photos.mjs'
      - '.github/workflows/test-storybook-free-image-discovery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  storybook-free-image-search:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax, source handling and historical subject matching
        run: |
          node --check storybook_commons_photos.mjs
          node --check storybook_motion_ui.mjs
          node --check tests_storybook_commons_photos.mjs
          node tests_storybook_commons_photos.mjs
          node tests_tools_six_navigation.mjs
          node tests_storybook_documentary.mjs

name: Deploy MyPocketAI to Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Multiple pushes cannot interleave two frontend/backend deployments.
concurrency:
  group: pocketai-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Verify generated app boot script before deployment
        run: |
          node --check index.js
          node tests_frontend_boot_syntax.mjs
          node --check communication_ui.mjs
          node tests_communication_ui.mjs
          node --check oracle_communication_ui.mjs
          node --check oracle-communication/server.mjs
          node tests_oracle_communication.mjs
          node tests_home_einstein_layout.mjs
          node tests_history_geography.mjs
          node tests_literature_europe.mjs
          node tests_literature_completion.mjs
          node tests_literature_verified_authors.mjs
          node tests_literature_tutor_response.mjs
          node tests_pdf_library.mjs
          node --check computing_curriculum.mjs
          node --check computing_ui.mjs
          node tests_computing_curriculum.mjs
          node --check exam_curriculum_europe.mjs
          node --check exam_practice_bank.mjs
          node --check exam_ordered_pathways.mjs
          node --check exam_ui.mjs
          node tests_exam_curriculum_europe.mjs
          node tests_university_admissions.mjs
          node --check practical_curriculum.mjs
          node --check practical_ui.mjs
          node --check education_selects_ui.mjs
          node tests_practical_courses.mjs
          node --check education_country_ui.mjs
          node --check education_school_paths.mjs
          node tests_education_country_first.mjs
          node tests_education_content_navigation.mjs

      - name: Verify contextual news translation and apply avatar lip-stop patch
        run: |
          node --check scripts/patch-avatar-lipsync.mjs
          node tests_eva_dialogue.mjs
          node tests_eva_history_recall.mjs
          node tests_remote_street_nearby.mjs
          node tests_local_multisource_shops.mjs
          node tests_fast_food_discovery.mjs
          node tests_food_global_dedup.mjs
          node tests_quick_places_categories.mjs
          node tests_photon_worldwide.mjs
          node tests_world_food_names.mjs
          node tests_verified_photo_v2.mjs
          node tests_fsa_trading_alias.mjs
          node tests_retail_categories.mjs
          node tests_global_places.mjs
          node tests_eva_context_clarification.mjs
          node tests_eva_backend_recall.mjs
          node tests_first_install_profile_search.mjs
          node tests_response_intent.mjs
          node tests_localization.mjs
          node tests_news_contextual_translation.mjs
          node tests_avatar_lipsync_stop.mjs
          node tests_mixed_selector_ui.mjs
          node tests_transit_final_mile.mjs
          node tests_address_progressive.mjs
          node tests_progressive_selector_policy.mjs
          node scripts/patch-avatar-lipsync.mjs public/avatar-v4.html

      - name: Install pinned Wrangler
        run: npm install --no-save --ignore-scripts --no-audit --no-fund wrangler@3.90.0

      - name: Deploy frontend (retry transient Cloudflare outages only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "::group::Frontend deploy attempt ${attempt}/3"
            log="$(mktemp)"
            set +e
            npx --no-install wrangler deploy --config wrangler-frontend.toml 2>&1 | tee "$log"
            status=${PIPESTATUS[0]}
            set -e
            echo "::endgroup::"
            if [ "$status" -eq 0 ]; then
              echo "Frontend deployed successfully (attempt ${attempt})."
              rm -f "$log"
              exit 0
            fi
            if ! grep -Eqi 'no healthy upstream|5(02|03|04) (Service Unavailable|Bad Gateway|Gateway Timeout)|\b(HTTP |status |-> )?(429|502|503|504)\b|rate limit(ed|ing)?|temporar(il)?y unavailable' "$log"; then
              echo "::error::Non-transient frontend deploy failure; no retry."
              rm -f "$log"
              exit "$status"
            fi
            rm -f "$log"
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Cloudflare transient failure persisted through 3 frontend attempts."
              exit "$status"
            fi
            if [ "$attempt" -eq 1 ]; then sleep 15; else sleep 45; fi
          done

  deploy-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Get repository files
        uses: actions/checkout@v4
      - name: Set up Node 22 for communication SQLite regression
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install backend dependencies and pinned Wrangler
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm install --no-save --ignore-scripts --no-audit --no-fund wrangler@3.90.0

      - name: Verify backend news-search routing before deploy
        run: |
          node --check backend.js
          node --check ai_response_quality.mjs
          node tests_response_quality.mjs
          node tests_communication_e2e.mjs
          node tests_literature_tutor_response.mjs
          npm run test:culinary
          node tests_eva_dialogue.mjs
          node tests_first_install_profile_search.mjs
          node tests_response_intent.mjs
          node tests_news_contextual_translation.mjs
          node tests_news_live_routing.mjs
          node tests_address_city_aliases.mjs
          node tests_address_progressive.mjs
          node tests_progressive_selector_policy.mjs
          node tests_mixed_selector_ui.mjs
          node tests_transit_final_mile.mjs
          node tests_mixed_uk_fallback.mjs

      - name: Validate Romanian national Bilo provider
        run: node tests_ro_national_transit.mjs

      - name: Deploy backend (retry transient Cloudflare outages only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "::group::Backend deploy attempt ${attempt}/3"
            log="$(mktemp)"
            set +e
            npx --no-install wrangler deploy --config wrangler-backend.toml 2>&1 | tee "$log"
            status=${PIPESTATUS[0]}
            set -e
            echo "::endgroup::"
            if [ "$status" -eq 0 ]; then
              echo "Backend deployed successfully (attempt ${attempt})."
              rm -f "$log"
              exit 0
            fi
            if ! grep -Eqi 'no healthy upstream|5(02|03|04) (Service Unavailable|Bad Gateway|Gateway Timeout)|\b(HTTP |status |-> )?(429|502|503|504)\b|rate limit(ed|ing)?|temporar(il)?y unavailable' "$log"; then
              echo "::error::Non-transient backend deploy failure; no retry."
              rm -f "$log"
              exit "$status"
            fi
            rm -f "$log"
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Cloudflare transient failure persisted through 3 backend attempts."
              exit "$status"
            fi
            if [ "$attempt" -eq 1 ]; then sleep 15; else sleep 45; fi
          done
      - name: Verify deprecated Cloudflare communication route is closed
        run: |
          node --input-type=module -e "const r=await fetch('https://lifewise-ai-api.kokocf.workers.dev/api/communication',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'health'})});const d=await r.json();if(r.status!==410||d.error!=='communication_moved_to_oracle'){console.error('Unexpected legacy chat route',r.status,d);process.exit(1)}console.log('Cloudflare chat writes disabled; Oracle is the selected endpoint');"

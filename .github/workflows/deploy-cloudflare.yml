name: Deploy MyPocketAI to Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Multiple pushes cannot interleave two frontend/backend deployments.
concurrency:
  group: pocketai-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Verify generated app boot script before deployment
        run: |
          node --check index.js
          node tests_frontend_boot_syntax.mjs
          node tests_assistant_quick_route.mjs
          node tests_one_field_live_request.mjs
          node tests_maps_empty_route_recovery.mjs
          node tests_corner_shop_retry_ui.mjs
          node tests_places_same_origin_proxy.mjs
          node tests_place_selection_media.mjs
          node tests_food_global_dedup.mjs
          node tests_education_android.mjs
          node --check communication_ui.mjs
          node tests_communication_ui.mjs
          node tests_communication_redesign.mjs
          node tests_communication_message_controls.mjs
          node tests_inline_voice_player.mjs
          node tests_communication_final_compact_ui.mjs
          node tests_communication_anchored_menus.mjs
          node tests_hotels_back_chat_fullscreen.mjs
          node --check oracle_communication_ui.mjs
          node --check oracle-communication/server.mjs
          node tests_oracle_communication.mjs
          node tests_home_einstein_layout.mjs
          node tests_history_geography.mjs
          node tests_literature_europe.mjs
          node tests_literature_completion.mjs
          node tests_literature_verified_authors.mjs
          node tests_literature_exact_paged_reader.mjs
          node tests_literature_study_typography_nav.mjs
          node tests_literature_grade1_offline.mjs
          node tests_navigation_route_entry_send_center.mjs
          node tests_literature_seven_country_library.mjs
          node tests_literature_tutor_response.mjs
          node tests_pdf_library.mjs
          node --check computing_curriculum.mjs
          node --check computing_ui.mjs
          node tests_computing_curriculum.mjs
          node --check exam_curriculum_europe.mjs
          node --check exam_practice_bank.mjs
          node --check exam_ordered_pathways.mjs
          node --check exam_ui.mjs
          node tests_exam_curriculum_europe.mjs
          node tests_university_admissions.mjs
          node --check practical_curriculum.mjs
          node --check practical_ui.mjs
          node --check education_selects_ui.mjs
          node tests_practical_courses.mjs
          node --check education_country_ui.mjs
          node --check education_school_paths.mjs
          node tests_education_country_first.mjs
          node tests_education_content_navigation.mjs
          node tests_science_navigation.mjs
          node tests_science_year_cards.mjs
          node tests_math_shared_workspace_layout.mjs
          node --check storybook_motion_ui.mjs
          node --check storybook_commons_photos.mjs
          node tests_tools_six_navigation.mjs

      - name: Verify contextual news translation and apply avatar lip-stop patch
        run: |
          node --check scripts/patch-avatar-lipsync.mjs
          node tests_eva_dialogue.mjs
          node tests_eva_history_recall.mjs
          node tests_remote_street_nearby.mjs
          node tests_local_multisource_shops.mjs
          node tests_fast_food_discovery.mjs
          node tests_food_global_dedup.mjs
          node tests_quick_places_categories.mjs
          node tests_poi_parallel_failover.mjs
          node tests_photon_worldwide.mjs
          node tests_world_food_names.mjs
          node tests_quick_places_no_photos.mjs
          node tests_fsa_trading_alias.mjs
          node tests_retail_categories.mjs
          node tests_global_places.mjs
          node tests_eva_context_clarification.mjs
          node tests_eva_backend_recall.mjs
          node tests_first_install_profile_search.mjs
          node tests_response_intent.mjs
          node tests_storybook_generation.mjs
          node tests_storybook_commons_photos.mjs
          node tests_localization.mjs
          node tests_news_contextual_translation.mjs
          node tests_avatar_lipsync_stop.mjs
          node tests_mixed_selector_ui.mjs
          node tests_transit_final_mile.mjs
          node tests_address_progressive.mjs
          node tests_progressive_selector_policy.mjs
          node tests_image_art_style_scrolling.mjs
          node scripts/patch-avatar-lipsync.mjs public/avatar-v4.html

      - name: Install pinned Wrangler
        run: npm install --no-save --ignore-scripts --no-audit --no-fund wrangler@3.90.0

      - name: Deploy frontend (retry transient Cloudflare outages only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "::group::Frontend deploy attempt ${attempt}/3"
            log="$(mktemp)"
            set +e
            npx --no-install wrangler deploy --config wrangler-frontend.toml 2>&1 | tee "$log"
            status=${PIPESTATUS[0]}
            set -e
            echo "::endgroup::"
            if [ "$status" -eq 0 ]; then
              echo "Frontend deployed successfully (attempt ${attempt})."
              rm -f "$log"
              exit 0
            fi
            if ! grep -Eqi 'no healthy upstream|5(02|03|04) (Service Unavailable|Bad Gateway|Gateway Timeout)|\b(HTTP |status |-> )?(429|502|503|504)\b|rate limit(ed|ing)?|temporar(il)?y unavailable' "$log"; then
              echo "::error::Non-transient frontend deploy failure; no retry."
              rm -f "$log"
              exit "$status"
            fi
            rm -f "$log"
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Cloudflare transient failure persisted through 3 frontend attempts."
              exit "$status"
            fi
            if [ "$attempt" -eq 1 ]; then sleep 15; else sleep 45; fi
          done

      - name: Live first-party POI results (real backend after deployment)
        run: |
          set -euo pipefail
          cat > /tmp/poi.json <<'JSON'
          {"message":"Caută restaurante în apropierea mea.","language":"ro","history":[],"module":"travel","location_requested":true,"location":{"latitude":51.4775,"longitude":0.3007,"accuracy":20},"quick_place_search":true,"place_category":"restaurant"}
          JSON
          status=$(curl -sS --retry 1 --retry-delay 2 --max-time 32 -o /tmp/places-result.json -w '%{http_code}' -X POST -H 'Content-Type: application/json' --data-binary @/tmp/poi.json 'https://lifewise-ai-v2.kokocf.workers.dev/api/chat')
          echo "same-origin HTTP=$status"
          [ "$status" = "200" ]
          python3 - <<'PY'
          import json
          with open('/tmp/places-result.json') as f:d=json.load(f)
          print('status:',d.get('status'),'search_ok:',d.get('search_ok'),'result_count:',len(d.get('places') or []))
          assert d.get('search_ok') is True and len(d.get('places') or [])>0,'Live nearby restaurants must return verified places'
          PY

      - name: Live Android place-details endpoint
        run: |
          set -euo pipefail
          curl --silent --show-error --max-time 20 --fail \
            'https://lifewise-ai-v2.kokocf.workers.dev/api/place-media?name=Test' \
            -o /tmp/poi-media-result.json
          python3 -c 'import json; d=json.load(open("/tmp/poi-media-result.json")); assert isinstance(d.get("details"),dict) and isinstance(d.get("logos"),list); print("PASS live Android place details")'
  deploy-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Get repository files
        uses: actions/checkout@v4
      - name: Set up Node 22 for communication SQLite regression
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install backend dependencies and pinned Wrangler
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm install --no-save --ignore-scripts --no-audit --no-fund wrangler@3.90.0

      - name: Verify backend news-search routing before deploy
        run: |
          node --check backend.js
          node tests_mixed_route_quality.mjs
          node tests_mixed_route_provider_search.mjs
          node tests_mixed_three_provider_handoff.mjs
          node tests_mixed_compact_cards.mjs
          node tests_mixed_transport_ui.mjs
          node tests_transport_availability_disclosure.mjs
          node tests_mixed_ground_transfer_discovery.mjs
          node tests_mixed_ground_operator_discovery.mjs
          node tests_mixed_unified_results.mjs
          node tests_mixed_existing_provider_adapters.mjs
          node tests_mixed_live_composition.mjs
          node tests_serpapi_account_status.mjs
          node --check mixed_serpapi_discovery.mjs
          node tests_mixed_serpapi_discovery.mjs
          node tests_mixed_air_ground_coexist.mjs
          node tests_serpapi_flight_pilot.mjs
          node tests_cloudflare_model_retirement.mjs
          node tests_walking_address_arrival.mjs
          node tests_corner_shop_walking_frontage.mjs
          node tests_romania_provider_readiness.mjs
          node tests_journey_city_autocomplete.mjs
          node tests_one_field_live_request.mjs
          node tests_navigation_distance_units.mjs
          node tests_all_route_background_navigation.mjs
          node --check ro_urban_client.mjs
          node tests_ro_urban_client.mjs
          node --check ai_response_quality.mjs
          node tests_response_quality.mjs
          node tests_communication_e2e.mjs
          node tests_literature_tutor_response.mjs
          npm run test:culinary
          node tests_eva_dialogue.mjs
          node tests_first_install_profile_search.mjs
          node tests_response_intent.mjs
          node tests_news_contextual_translation.mjs
          node tests_news_live_routing.mjs
          node tests_address_city_aliases.mjs
          node tests_journey_partial_locality.mjs
          node tests_address_progressive.mjs
          node tests_progressive_selector_policy.mjs
          node tests_mixed_selector_ui.mjs
          node tests_transit_final_mile.mjs
          node tests_mixed_uk_fallback.mjs
          node tests_short_local_transit_arrival.mjs

      - name: Validate Romanian national Bilo provider
        run: node tests_ro_national_transit.mjs

      - name: Deploy backend (retry transient Cloudflare outages only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "::group::Backend deploy attempt ${attempt}/3"
            log="$(mktemp)"
            set +e
            npx --no-install wrangler deploy --config wrangler-backend.toml 2>&1 | tee "$log"
            status=${PIPESTATUS[0]}
            set -e
            echo "::endgroup::"
            if [ "$status" -eq 0 ]; then
              echo "Backend deployed successfully (attempt ${attempt})."
              rm -f "$log"
              exit 0
            fi
            if ! grep -Eqi 'no healthy upstream|5(02|03|04) (Service Unavailable|Bad Gateway|Gateway Timeout)|\b(HTTP |status |-> )?(429|502|503|504)\b|rate limit(ed|ing)?|temporar(il)?y unavailable' "$log"; then
              echo "::error::Non-transient backend deploy failure; no retry."
              rm -f "$log"
              exit "$status"
            fi
            rm -f "$log"
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Cloudflare transient failure persisted through 3 backend attempts."
              exit "$status"
            fi
            if [ "$attempt" -eq 1 ]; then sleep 15; else sleep 45; fi
          done
      - name: Verify deprecated Cloudflare communication route is closed
        run: |
          node --input-type=module -e "const r=await fetch('https://lifewise-ai-api.kokocf.workers.dev/api/communication',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'health'})});const d=await r.json();if(r.status!==410||d.error!=='communication_moved_to_oracle'){console.error('Unexpected legacy chat route',r.status,d);process.exit(1)}console.log('Cloudflare chat writes disabled; Oracle is the selected endpoint');"

name: England GTFS disk profiler regression
on:
  push:
    branches: [feat/gtfs-sqlite-indexed-20261116]
    paths:
      - 'oracle-transport-bridge/audit-england-disk.py'
      - 'tests_england_disk_audit.py'
      - '.github/workflows/england-disk-audit-ci.yml'
  pull_request:
    paths:
      - 'oracle-transport-bridge/audit-england-disk.py'
      - 'tests_england_disk_audit.py'
      - '.github/workflows/england-disk-audit-ci.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 -m py_compile oracle-transport-bridge/audit-england-disk.py tests_england_disk_audit.py
          python3 tests_england_disk_audit.py

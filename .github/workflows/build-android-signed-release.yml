name: Build myPocketAI SIGNED release APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'index.js'
      - 'tests_home_einstein_layout.mjs'
      - 'practical_*.mjs'
      - 'exam_*.mjs'
      - 'university_domains.mjs'
      - 'education_selects_ui.mjs'
      - 'education_country_ui.mjs'
      - 'education_school_paths.mjs'
      - 'computing_*.mjs'
      - 'literature_curriculum_europe.mjs'
      - 'literature_verified_authors.mjs'
      - 'tests_literature_verified_authors.mjs'
      - 'history_geography_curriculum.mjs'
      - 'tests_computing_curriculum.mjs'
      - 'tests_literature_europe.mjs'
      - 'tests_history_geography.mjs'
      - 'tests_education_country_first.mjs'
      - 'tests_practical_courses.mjs'
      - 'tests_exam_curriculum_europe.mjs'
      - 'university_admissions_verified.mjs'
      - 'tests_university_admissions.mjs'
      - 'tests_frontend_boot_syntax.mjs'
      - 'tests_education_android.mjs'
      - 'tests_pdf_library.mjs'
      - 'scripts/patch-avatar-lipsync.mjs'
      - 'tests_avatar_lipsync_stop.mjs'
      - 'tests_math_whisper_pilot.mjs'
      - 'tests_math_voice_parentheses.mjs'
      - 'tests_math_linear_equations.mjs'
      - 'tests_math_linear_graph_proof.mjs'
      - 'tests_math_linear_verification.mjs'
      - '.github/workflows/build-android-apk.yml'
      - '.github/workflows/build-android-signed-release.yml'

permissions:
  contents: read

jobs:
  apk-signed-release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Require permanent signing credentials (never silently fall back to debug)
        env:
          POCKET_KEYSTORE_B64: ${{ secrets.POCKET_KEYSTORE_B64 }}
          POCKET_STORE_PASSWORD: ${{ secrets.POCKET_STORE_PASSWORD }}
          POCKET_KEY_PASSWORD: ${{ secrets.POCKET_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$POCKET_KEYSTORE_B64" || -z "$POCKET_STORE_PASSWORD" || -z "$POCKET_KEY_PASSWORD" ]]; then
            echo '::error::SIGNED RELEASE NOT CONFIGURED: Set POCKET_KEYSTORE_B64, POCKET_STORE_PASSWORD and POCKET_KEY_PASSWORD. No debug APK will be provided by this workflow.'
            exit 1
          fi
          # Diagnose the exact class of failure without revealing any credential.
          key_file="$RUNNER_TEMP/pocket-release.jks"
          if ! printf '%s' "$POCKET_KEYSTORE_B64" | tr -d '[:space:]' | base64 --decode > "$key_file" 2>/dev/null; then
            echo '::error::POCKET_KEYSTORE_B64 is not valid Base64. Copy only the complete value, not the heading or Value: label.'
            exit 1
          fi
          chmod 600 "$key_file"
          if [[ ! -s "$key_file" ]]; then
            echo '::error::POCKET_KEYSTORE_B64 decoded to an empty keystore.'
            exit 1
          fi
          expected_sha256='4f1c7e49579217c7f9b36847aa78932eabc097c871ac5e4ab0ece9254001aea4'
          actual_sha256="$(sha256sum "$key_file" | cut -d' ' -f1)"
          if [[ "$actual_sha256" != "$expected_sha256" ]]; then
            echo '::error::POCKET_KEYSTORE_B64 does not match the supplied private .jks backup. Re-copy its full Base64 value from GITHUB_ACTIONS_SECRETS_PRIVATE.txt.'
            exit 1
          fi
          if ! keytool -list -keystore "$key_file" -storepass "$POCKET_STORE_PASSWORD" >/dev/null 2>&1; then
            echo '::error::POCKET_STORE_PASSWORD does not open the verified keystore. Re-copy its value from the private backup.'
            exit 1
          fi
          # The alias is public keystore metadata, not a password. Use the
          # verified alias instead of relying on a manually copied secret.
          signing_alias='mypocketai-release'
          if ! keytool -list -keystore "$key_file" -storepass "$POCKET_STORE_PASSWORD" -alias "$signing_alias" >/dev/null 2>&1; then
            echo '::error::Expected Android release signing alias is missing from the verified keystore.'
            exit 1
          fi
          if ! keytool -certreq -keystore "$key_file" -storepass "$POCKET_STORE_PASSWORD" -alias "$signing_alias" -keypass "$POCKET_KEY_PASSWORD" -file "$RUNNER_TEMP/pocket-check.csr" >/dev/null 2>&1; then
            echo '::error::POCKET_KEY_PASSWORD cannot access the signing key. Re-copy the password from the private backup.'
            exit 1
          fi
          rm -f "$RUNNER_TEMP/pocket-check.csr"
          echo "POCKET_KEY_ALIAS=$signing_alias" >> "$GITHUB_ENV"
          echo "POCKET_KEYSTORE_PATH=$key_file" >> "$GITHUB_ENV"
          echo "POCKET_VERSION_CODE=$((500000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
      - name: Check JS syntax and mathematics transcription pilot
        run: |
          node --check index.js
          node --check backend.js
          node --check practical_curriculum.mjs
          node --check practical_guides.mjs
          node --check practical_syllabi.mjs
          node --check practical_depth.mjs
          node --check practical_depth_extra.mjs
          node --check practical_ui.mjs
          node --check exam_curriculum_europe.mjs
          node --check exam_ui.mjs
          node --check university_domains.mjs
          node --check computing_curriculum.mjs
          node --check computing_ui.mjs
          node --check education_country_ui.mjs
          node --check education_school_paths.mjs
          node --check literature_curriculum_europe.mjs
          node tests_frontend_boot_syntax.mjs
          node tests_home_einstein_layout.mjs
          node tests_exam_curriculum_europe.mjs
          node tests_university_admissions.mjs
          node tests_computing_curriculum.mjs
          node tests_literature_europe.mjs
          node --check literature_verified_authors.mjs
          node tests_literature_verified_authors.mjs
          node tests_history_geography.mjs
          node tests_education_country_first.mjs
          node tests_education_content_navigation.mjs
          node tests_practical_courses.mjs
          node tests_education_android.mjs
          node tests_pdf_library.mjs
          node tests_math_voice_parentheses.mjs
          node tests_math_linear_equations.mjs
          node tests_math_linear_graph_proof.mjs
          node tests_math_linear_verification.mjs
          node tests_avatar_lipsync_stop.mjs
          node tests_news_contextual_translation.mjs
          node tests_math_whisper_pilot.mjs
      - name: Assemble signed release
        env:
          POCKET_STORE_PASSWORD: ${{ secrets.POCKET_STORE_PASSWORD }}
          POCKET_KEY_PASSWORD: ${{ secrets.POCKET_KEY_PASSWORD }}
        run: gradle -p android --no-daemon assembleRelease
      - name: Verify signed APK and version
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -1
      - uses: actions/upload-artifact@v4
        with:
          name: myPocketAI-android-signed-release
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
      - name: Remove temporary private signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/pocket-release.jks"

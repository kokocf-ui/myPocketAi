name: Build myPocketAI SIGNED release APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk-signed-release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Require permanent signing credentials (never silently fall back to debug)
        env:
          POCKET_KEYSTORE_B64: ${{ secrets.POCKET_KEYSTORE_B64 }}
          POCKET_STORE_PASSWORD: ${{ secrets.POCKET_STORE_PASSWORD }}
          POCKET_KEY_ALIAS: ${{ secrets.POCKET_KEY_ALIAS }}
          POCKET_KEY_PASSWORD: ${{ secrets.POCKET_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$POCKET_KEYSTORE_B64" || -z "$POCKET_STORE_PASSWORD" || -z "$POCKET_KEY_ALIAS" || -z "$POCKET_KEY_PASSWORD" ]]; then
            echo '::error::SIGNED RELEASE NOT CONFIGURED: Set all four POCKET_* repository Actions secrets. No debug APK will be provided by this workflow.'
            exit 1
          fi
          printf '%s' "$POCKET_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/pocket-release.jks"
          chmod 600 "$RUNNER_TEMP/pocket-release.jks"
          test -s "$RUNNER_TEMP/pocket-release.jks"
          keytool -list -keystore "$RUNNER_TEMP/pocket-release.jks" -storepass "$POCKET_STORE_PASSWORD" -alias "$POCKET_KEY_ALIAS" >/dev/null
          echo "POCKET_KEYSTORE_PATH=$RUNNER_TEMP/pocket-release.jks" >> "$GITHUB_ENV"
          echo "POCKET_VERSION_CODE=$((500000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
      - name: Check JS syntax and mathematics transcription pilot
        run: |
          node --check index.js
          node --check backend.js
          node tests_math_voice_parentheses.mjs
          node tests_math_whisper_pilot.mjs
      - name: Assemble signed release
        env:
          POCKET_STORE_PASSWORD: ${{ secrets.POCKET_STORE_PASSWORD }}
          POCKET_KEY_ALIAS: ${{ secrets.POCKET_KEY_ALIAS }}
          POCKET_KEY_PASSWORD: ${{ secrets.POCKET_KEY_PASSWORD }}
        run: gradle -p android --no-daemon assembleRelease
      - name: Verify signed APK and version
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -1
      - uses: actions/upload-artifact@v4
        with:
          name: myPocketAI-android-signed-release
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
      - name: Remove temporary private signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/pocket-release.jks"

name: Telegram MTProto offline bundle validation
on:
  pull_request:
    branches: [main]
    paths:
      - 'backend.js'
      - 'telegram_mtproto_direct.mjs'
      - 'tests_telegram_mtproto_direct.mjs'
      - 'scripts/telegram-mtproto-login.mjs'
      - 'scripts/telegram-code-fallback.mjs'
      - 'scripts/telegram-code-fallback.test.mjs'
      - 'scripts/telegram-code-delivery.mjs'
      - 'scripts/telegram-code-delivery.test.mjs'
      - 'scripts/telegram-login-dc.mjs'
      - 'scripts/telegram-login-dc.test.mjs'
      - 'package.json'
      - '.github/workflows/test-telegram-mtproto-build.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  telegram-dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install packages without running install hooks
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Validate Termux login script and prohibit fragile private readline hooks
        run: |
          node --check scripts/telegram-mtproto-login.mjs
          node scripts/telegram-code-delivery.test.mjs
          node scripts/telegram-code-fallback.test.mjs
          node --input-type=module -e "import {readFileSync} from 'node:fs'; import assert from 'node:assert/strict'; const text=readFileSync('scripts/telegram-mtproto-login.mjs','utf8'); assert.match(text,/reconnectRetries:2,requestRetries:1,autoReconnect:true/);"
          node --check scripts/telegram-login-dc.mjs
          node scripts/telegram-login-dc.test.mjs
          if grep -q '_writeToOutput' scripts/telegram-mtproto-login.mjs; then
            echo 'Private readline hooks are not portable to Termux' >&2
            exit 1
          fi
      - name: Offline route and privacy regression (NO Telegram, NO Workers AI calls)
        run: node tests_telegram_mtproto_direct.mjs
      - name: Bundle Worker without deploying or contacting Telegram
        run: npx -y wrangler@4 deploy --dry-run --config wrangler-backend.toml --outdir /tmp/pocketai-telegram-bundle

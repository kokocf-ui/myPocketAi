name: Live POI connectivity diagnosis
on:
  push:
    paths:
      - '.github/workflows/live-poi-diagnostic.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-poi:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Compare public API connectivity, CORS and real POI responses
        shell: bash
        run: |
          set -u
          url='https://lifewise-ai-v2.kokocf.workers.dev/api/chat'
          echo '== OPTIONS preflight (as WebView browser) =='
          curl --silent --show-error --max-time 12 --output /tmp/options --dump-header /tmp/opts-headers --write-out 'HTTP:%{http_code} TOTAL:%{time_total} DNS:%{time_namelookup} CONNECT:%{time_connect} TLS:%{time_appconnect}\n' \
            --request OPTIONS "$url" \
            --header 'Origin: https://lifewise-ai-v2.kokocf.workers.dev' \
            --header 'Access-Control-Request-Method: POST' \
            --header 'Access-Control-Request-Headers: content-type' || true
          sed -n '1,25p' /tmp/opts-headers 2>/dev/null || true
          echo '== JSON category requests (synthetic location, no personal data) =='
          for cat in restaurant fast_food parking; do
            echo "::group::POST category=$cat"
            body=$(printf '{"message":"Caută locuri în apropierea mea.","language":"ro","history":[],"module":"travel","location_requested":true,"location":{"latitude":51.4775,"longitude":0.3007,"accuracy":20},"coordinates":{"latitude":51.4775,"longitude":0.3007,"accuracy":20},"quick_place_search":true,"place_category":"%s"}' "$cat")
            curl --silent --show-error --max-time 32 --output /tmp/poi-response \
              --dump-header /tmp/poi-headers \
              --write-out 'HTTP:%{http_code} TOTAL:%{time_total} DNS:%{time_namelookup} CONNECT:%{time_connect} TLS:%{time_appconnect} START:%{time_starttransfer} SIZE:%{size_download}\n' \
              --header 'Origin: https://lifewise-ai-v2.kokocf.workers.dev' \
              --header 'Content-Type: application/json' \
              --request POST --data "$body" "$url"
            status=$?
            echo "curl_exit_code=$status"
            grep -Ei '^(HTTP/|server:|cf-ray:|content-type:|access-control-allow-origin:|server-timing:)' /tmp/poi-headers || true
            if [ -s /tmp/poi-response ]; then
              python3 -c 'import json,pathlib; s=pathlib.Path("/tmp/poi-response").read_text(errors="replace"); print((json.dumps({k:json.loads(s).get(k) for k in ("status","search_ok","search_error_code","search_error_name","search_error_detail","search_http_status","search_elapsed_ms","search_provider_failures","sparse_recovery_status","server_total_ms","results_count","source","reply")},ensure_ascii=False) if s.startswith("{") else s)[:1400])' || true
            fi
            echo "::endgroup::"
          done
          echo 'Diagnostic only: no credentials or private coordinates were used.'

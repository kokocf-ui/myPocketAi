name: Android persistent navigation validation
on:
  push:
    branches:
      - feat/gtfs-sqlite-indexed-20261116
    paths:
      - 'android/**'
      - 'tests_android_navigation_notification.mjs'
      - 'tests_android_navigation_bridge_runtime.mjs'
      - '.github/workflows/navigation-background-ci.yml'
jobs:
  android-navigation-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Validate navigation service and browser handoff
        run: |
          node tests_android_navigation_notification.mjs
          node tests_android_navigation_bridge_runtime.mjs
          node tests_oracle_fcm.mjs
          node tests_communication_message_controls.mjs
          node tests_transit_final_mile.mjs
      - name: Inspect actual navigation lifecycle entrypoints
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const s=readFileSync('index.js','utf8');
          const terms=['function showPreciseJourney(','async function showFinalTransitWalk(',
            'function appendFinalTransitWalkAction(','function showRouteMap(',
            'function renderTransitChoices(','function showTransitDestination(',
            'function appendTransitLegs(','function showNavigationReturn(',
            'function startNavigation(','function stopNavigation('];
          const re=/naviga(?:t|ț|ţi|ri|re)|\.geolocation\.watchPosition|watchPosition\(/ig;
          const hits=[...s.matchAll(re)].map(m=>m.index);
          console.log('--- EXACT FUNCTION ANCHORS ---');
          for(const term of terms){
            const p=s.indexOf(term);
            if(p>=0)console.log('ANCHOR '+term+' AT '+p+'\n'+s.slice(p,p+1800));
          }
          console.log('--- NAVIGATION KEYWORD CONTEXT ---');
          const choices=hits.filter(p=>/start|stop|active|open|turn|go|gps|naviga|tracking|route|walk/i.test(s.slice(p-210,p+240)));
          for(const p of choices.slice(-45))console.log('HIT @'+p+' '+s.slice(Math.max(0,p-230),p+380).replace(/\\n/g,' '));
          NODE
      - name: Compile Android debug APK
        run: gradle -p android --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: pocketai-navigation-foreground-debug-not-upgradeable
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

name: Mixed international GPS to Romania and burgundy retry
on:
  push:
    branches: [fix/mixed-international-origin-and-burgundy-20261116]
  pull_request:
    paths:
      - 'ro_national_transit.mjs'
      - 'backend.js'
      - 'one_field_journey_ui.mjs'
      - 'index.js'
      - 'tests_mixed_international_regression.mjs'
      - 'mixed_ground_operator_discovery.mjs'
      - 'tests_mixed_ground_operator_discovery.mjs'
      - 'mixed_serpapi_discovery.mjs'
      - 'tests_mixed_flight_provider_reliability.mjs'
      - 'tests_mixed_serpapi_discovery.mjs'
      - 'mixed_flight_ground_connections.mjs'
      - 'tests_mixed_flight_ground_connections.mjs'
      - 'mixed_fixed_point_access.mjs'
      - 'tests_mixed_fixed_point_access.mjs'
      - 'mixed_romanian_airport_onward.mjs'
      - 'tests_mixed_romanian_airport_onward.mjs'
      - 'tests_mixed_unified_results.mjs'
      - 'tests_mixed_door_to_door_details.mjs'
      - 'mixed_prefetched_details.mjs'
      - 'tests_mixed_prefetched_details.mjs'
      - 'tests_transport_departure_entrypoints.mjs'
      - '.github/workflows/test-mixed-international-regression.yml'
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and screenshot scenario
        run: |
          node --check backend.js
          node --check index.js
          node --check one_field_journey_ui.mjs
          node tests_mixed_international_regression.mjs
          node tests_mixed_ground_operator_discovery.mjs
          node tests_mixed_serpapi_discovery.mjs
          node tests_mixed_flight_ground_connections.mjs
          node tests_mixed_fixed_point_access.mjs
          node tests_mixed_romanian_airport_onward.mjs
          node tests_mixed_unified_results.mjs
          node tests_mixed_door_to_door_details.mjs
          node tests_mixed_prefetched_details.mjs
          node tests_mixed_flight_provider_reliability.mjs
          node tests_transport_departure_entrypoints.mjs
          node tests_ro_national_transit.mjs
          node tests_mixed_selector_ui.mjs
          node tests_frontend_boot_syntax.mjs

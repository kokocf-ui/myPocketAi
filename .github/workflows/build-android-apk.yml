name: Build myPocket AI Android APK
on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'index.js'
      - 'tests_education_android.mjs'
      - '.github/workflows/build-android-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check preinstalled Android SDK
        run: |
          test -d "${ANDROID_HOME:-/usr/local/lib/android/sdk}/platforms" || { echo 'Android SDK platforms missing'; exit 1; }
          echo "SDK directory: ${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          ls "${ANDROID_HOME:-/usr/local/lib/android/sdk}/platforms"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Validate frontend syntax
        run: node --check index.js && node tests_education_android.mjs
      - name: Compile Android debug APK
        run: gradle -p android --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: myPocketAI-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

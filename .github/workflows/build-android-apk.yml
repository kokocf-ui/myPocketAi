name: Build myPocket AI Android APK
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'one_field_journey_ui.mjs'
      - 'national_public_transport_ui.mjs'
      - 'tests_transport_departure_entrypoints.mjs'
      - 'android/**'
      - 'index.js'
      - 'backend.js'
      - 'communication_ui.mjs'
      - 'communication_live_style.mjs'
      - 'oracle_communication_ui.mjs'
      - 'tests_communication_redesign.mjs'
      - 'tests_inline_voice_player.mjs'
      - 'tests_communication_final_compact_ui.mjs'
      - 'tests_communication_anchored_menus.mjs'
      - 'european_app_locales.mjs'
      - 'language_first_install.mjs'
      - 'literature_seven_country_tracks.mjs'
      - 'literature_school_streams.mjs'
      - 'literature_task_ui.mjs'
      - 'literature_offline_activity.mjs'
      - 'tests_literature_grade1_offline.mjs'
      - 'literature_study_typography.mjs'
      - 'navigation_return_accent.mjs'
      - 'tests_navigation_route_entry_send_center.mjs'
      - 'tests_literature_study_typography_nav.mjs'
      - 'literature_reader_pagination.mjs'
      - 'tests_literature_exact_paged_reader.mjs'
      - 'literature_verified_authors.mjs'
      - 'literature_seven_country_library.mjs'
      - 'tests_literature_seven_country_library.mjs'
      - 'tests_hungarian_school_paths.mjs'
      - 'literature_curriculum_europe.mjs'
      - 'education_worldwide_paths.mjs'
      - 'education_country_ui.mjs'
      - 'tests_seven_europe_literature.mjs'
      - 'backend.js'
      - 'tests_pdf_library_bulk_preview.mjs'
      - 'extra_tools_workspace.mjs'
      - 'tests_extra_tools_header_layout.mjs'
      - 'tests_creation_ui.mjs'
      - 'creator_site_ui.mjs'
      - 'creator_design_gallery.mjs'
      - 'creator_premium_presentations.mjs'
      - 'tests_creator_premium_presentations.mjs'
      - 'tests_creation_site_v2.mjs'
      - 'creator_site_ai.mjs'
      - 'creator_management_ui.mjs'
      - 'tests_creator_management_and_translation.mjs'
      - 'creator_image_ai.mjs'
      - 'creator_preview_worker.mjs'
      - 'tests_creator_live_ui.mjs'
      - 'tests_image_art_style_scrolling.mjs'
      - 'tests_creator_preview_worker.mjs'
      - '.github/workflows/build-android-apk.yml'
permissions:
  contents: read
jobs:
  apk-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check preinstalled Android SDK
        run: |
          test -d "${ANDROID_HOME:-/usr/local/lib/android/sdk}/platforms" || { echo 'Android SDK platforms missing'; exit 1; }
          echo "SDK directory: ${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          ls "${ANDROID_HOME:-/usr/local/lib/android/sdk}/platforms"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Validate frontend syntax
        run: node --check index.js && node --check android/app/src/main/assets/avatar-enter.js && node tests_android_startup_bridge.mjs && node tests_mixed_route_quality.mjs && node tests_mixed_route_provider_search.mjs && node tests_mixed_existing_provider_adapters.mjs && node tests_transit_full_journey_native.mjs && node tests_transit_navigation_resume.mjs && node --check backend.js && node tests_assistant_quick_route.mjs && node tests_short_local_transit_arrival.mjs && node tests_communication_ui.mjs && node tests_communication_redesign.mjs && node tests_communication_message_controls.mjs && node tests_inline_voice_player.mjs && node tests_communication_final_compact_ui.mjs && node tests_communication_anchored_menus.mjs && node tests_comm_delivery_avatar_stability.mjs && node tests_hotels_back_chat_fullscreen.mjs && node tests_oracle_fcm.mjs && node tests_response_quality.mjs && node tests_avatar_brand_pronunciation.mjs && node tests_math_linear_equations.mjs && node tests_math_linear_graph_proof.mjs && node tests_math_linear_verification.mjs && node tests_avatar_lipsync_stop.mjs && node tests_avatar_launch_boundaries.mjs && node tests_eva_history_recall.mjs && node tests_eva_context_clarification.mjs && node tests_eva_backend_recall.mjs && node tests_eva_dialogue.mjs && node tests_remote_street_nearby.mjs && node tests_local_multisource_shops.mjs && node tests_fsa_trading_alias.mjs && node tests_retail_categories.mjs && node tests_global_places.mjs && node tests_education_android.mjs && node tests_first_install_profile_search.mjs && node tests_shopping_workspace.mjs && node tests_agenda_android_reminders.mjs && node tests_literature_seven_country_library.mjs && node tests_literature_study_typography_nav.mjs && node tests_literature_grade1_offline.mjs && node tests_navigation_route_entry_send_center.mjs && node tests_literature_exact_paged_reader.mjs && node tests_seven_europe_literature.mjs && node tests_hungarian_school_paths.mjs
      - name: Verify Tools workspace navigation and fixed header
        run: node tests_extra_tools_header_layout.mjs && node tests_extra_tools_workspace.mjs && node tests_creation_ui.mjs && node tests_creation_site_v2.mjs && node tests_creator_management_and_translation.mjs && node tests_creator_premium_presentations.mjs && node tests_creator_live_ui.mjs && node tests_image_art_style_scrolling.mjs && node tests_creator_preview_worker.mjs
      - name: Verify shared mathematics layout and native Back in paged theory
        run: node tests_math_shared_workspace_layout.mjs && node tests_education_android.mjs
      - name: Verify Sciences subject-year navigation and centered selection cards
        run: node tests_science_navigation.mjs && node tests_science_compact_theory.mjs && node tests_chemistry_three_sections.mjs && node tests_science_year_cards.mjs
      - name: Build debug APK (CI validation only; not a stable update)
        env:
          POCKET_VERSION_CODE: ${{ github.run_number }}
          POCKET_FIREBASE_API_KEY: ${{ vars.POCKET_FIREBASE_API_KEY }}
          POCKET_FIREBASE_APP_ID: ${{ vars.POCKET_FIREBASE_APP_ID }}
          POCKET_FIREBASE_PROJECT_ID: ${{ vars.POCKET_FIREBASE_PROJECT_ID }}
          POCKET_FIREBASE_SENDER_ID: ${{ vars.POCKET_FIREBASE_SENDER_ID }}
        run: gradle -p android --no-daemon assembleDebug
      # Stable, updatable APKs are built separately by
      # build-android-signed-release.yml with the verified keystore/alias.
      # This workflow only validates a debug compile; it must not try signing
      # the same release a second time with a stale POCKET_KEY_ALIAS secret.
      - uses: actions/upload-artifact@v4
        with:
          name: myPocketAI-android-debug-NOT-UPGRADEABLE
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

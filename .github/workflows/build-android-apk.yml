name: Build myPocket AI Android APK
on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'index.js'
      - 'tests_education_android.mjs'
      - 'tests_math_linear_equations.mjs'
      - 'tests_math_linear_graph_proof.mjs'
      - 'tests_shopping_workspace.mjs'
      - 'tests_agenda_android_reminders.mjs'
      - '.github/workflows/build-android-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check preinstalled Android SDK
        run: |
          test -d "${ANDROID_HOME:-/usr/local/lib/android/sdk}/platforms" || { echo 'Android SDK platforms missing'; exit 1; }
          echo "SDK directory: ${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          ls "${ANDROID_HOME:-/usr/local/lib/android/sdk}/platforms"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Validate frontend syntax
        run: node --check index.js && node tests_math_linear_equations.mjs && node tests_math_linear_graph_proof.mjs && node tests_education_android.mjs && node tests_shopping_workspace.mjs && node tests_agenda_android_reminders.mjs
      - name: Build debug APK (CI validation only; not a stable update)
        env:
          POCKET_VERSION_CODE: ${{ github.run_number }}
        run: gradle -p android --no-daemon assembleDebug
      - name: Prepare persistent release signing key
        id: signing
        env:
          POCKET_KEYSTORE_B64: ${{ secrets.POCKET_KEYSTORE_B64 }}
          POCKET_STORE_PASSWORD: ${{ secrets.POCKET_STORE_PASSWORD }}
          POCKET_KEY_ALIAS: ${{ secrets.POCKET_KEY_ALIAS }}
          POCKET_KEY_PASSWORD: ${{ secrets.POCKET_KEY_PASSWORD }}
        run: |
          if [[ -z "$POCKET_KEYSTORE_B64" && -z "$POCKET_STORE_PASSWORD" && -z "$POCKET_KEY_ALIAS" && -z "$POCKET_KEY_PASSWORD" ]]; then
            echo "Release signing not configured. Debug build is NOT upgradeable across clean GitHub runners."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -z "$POCKET_KEYSTORE_B64" || -z "$POCKET_STORE_PASSWORD" || -z "$POCKET_KEY_ALIAS" || -z "$POCKET_KEY_PASSWORD" ]]; then
            echo "::error::Incomplete POCKET_* signing secrets; cannot safely produce release APK."
            exit 1
          fi
          echo "$POCKET_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/pocket-release.jks"
          test -s "$RUNNER_TEMP/pocket-release.jks"
          echo "enabled=true" >> "$GITHUB_OUTPUT"
      - name: Build updateable signed release APK
        if: steps.signing.outputs.enabled == 'true'
        env:
          POCKET_VERSION_CODE: ${{ github.run_number }}
          POCKET_KEYSTORE_PATH: ${{ runner.temp }}/pocket-release.jks
          POCKET_STORE_PASSWORD: ${{ secrets.POCKET_STORE_PASSWORD }}
          POCKET_KEY_ALIAS: ${{ secrets.POCKET_KEY_ALIAS }}
          POCKET_KEY_PASSWORD: ${{ secrets.POCKET_KEY_PASSWORD }}
        run: gradle -p android --no-daemon assembleRelease
      - name: Verify release APK signer and version
        if: steps.signing.outputs.enabled == 'true'
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -1
      - uses: actions/upload-artifact@v4
        if: steps.signing.outputs.enabled == 'true'
        with:
          name: myPocketAI-android-signed-release
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: steps.signing.outputs.enabled != 'true'
        with:
          name: myPocketAI-android-debug-NOT-UPGRADEABLE
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/pocket-release.jks"

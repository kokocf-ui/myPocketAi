name: Build myPocket AI Android APK
on:
  workflow_dispatch:
    inputs:
      publish_signed_apk:
        description: 'Publish this signed branch-test APK as a prerelease with a direct download link (no production deploy)'
        type: boolean
        default: false
        required: false
  pull_request:
    branches: [main]
    paths:
      - 'one_field_journey_ui.mjs'
      - 'tests_one_field_live_request.mjs'
      - 'national_public_transport_ui.mjs'
      - 'tests_transport_departure_entrypoints.mjs'
      - 'android/**'
      - 'index.js'
      - 'backend.js'
      - 'communication_ui.mjs'
      - 'communication_live_style.mjs'
      - 'oracle_communication_ui.mjs'
      - 'tests_communication_redesign.mjs'
      - 'tests_inline_voice_player.mjs'
      - 'tests_communication_final_compact_ui.mjs'
      - 'tests_communication_anchored_menus.mjs'
      - 'european_app_locales.mjs'
      - 'language_first_install.mjs'
      - 'literature_seven_country_tracks.mjs'
      - 'literature_school_streams.mjs'
      - 'literature_task_ui.mjs'
      - 'literature_essay_contract.mjs'
      - 'literature_ro_grade_progression.mjs'
      - 'tests_literature_ro_grade_progression.mjs'
      - 'literature_offline_activity.mjs'
      - 'tests_literature_grade1_offline.mjs'
      - 'literature_study_typography.mjs'
      - 'navigation_return_accent.mjs'
      - 'tests_navigation_route_entry_send_center.mjs'
      - 'tests_literature_study_typography_nav.mjs'
      - 'literature_reader_pagination.mjs'
      - 'tests_literature_exact_paged_reader.mjs'
      - 'literature_verified_authors.mjs'
      - 'literature_seven_country_library.mjs'
      - 'tests_literature_seven_country_library.mjs'
      - 'tests_hungarian_school_paths.mjs'
      - 'literature_curriculum_europe.mjs'
      - 'education_worldwide_paths.mjs'
      - 'education_country_ui.mjs'
      - 'tests_seven_europe_literature.mjs'
      - 'backend.js'
      - 'tests_pdf_library_bulk_preview.mjs'
      - 'extra_tools_workspace.mjs'
      - 'tests_extra_tools_header_layout.mjs'
      - 'tests_creation_ui.mjs'
      - 'creator_site_ui.mjs'
      - 'creator_design_gallery.mjs'
      - 'creator_premium_presentations.mjs'
      - 'tests_creator_premium_presentations.mjs'
      - 'tests_creation_site_v2.mjs'
      - 'creator_site_ai.mjs'
      - 'creator_management_ui.mjs'
      - 'tests_creator_management_and_translation.mjs'
      - 'creator_image_ai.mjs'
      - 'creator_preview_worker.mjs'
      - 'tests_creator_live_ui.mjs'
      - 'tests_image_art_style_scrolling.mjs'
      - 'tests_creator_preview_worker.mjs'
      - '.github/workflows/build-android-apk.yml'
permissions:
  contents: read
jobs:
  apk-debug:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check preinstalled Android SDK
        run: |
          test -d "${ANDROID_HOME:-/usr/local/lib/android/sdk}/platforms" || { echo 'Android SDK platforms missing'; exit 1; }
          echo "SDK directory: ${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          ls "${ANDROID_HOME:-/usr/local/lib/android/sdk}/platforms"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Validate frontend syntax
        run: node --check index.js && node --check android/app/src/main/assets/avatar-enter.js && node tests_android_startup_bridge.mjs && node tests_mixed_route_quality.mjs && node tests_mixed_route_provider_search.mjs && node tests_mixed_existing_provider_adapters.mjs && node tests_transit_full_journey_native.mjs && node tests_transit_navigation_resume.mjs && node --check backend.js && node tests_assistant_quick_route.mjs
          node tests_one_field_live_request.mjs && node tests_short_local_transit_arrival.mjs && node tests_communication_ui.mjs && node tests_communication_redesign.mjs && node tests_communication_message_controls.mjs && node tests_inline_voice_player.mjs && node tests_communication_final_compact_ui.mjs && node tests_communication_anchored_menus.mjs && node tests_comm_delivery_avatar_stability.mjs && node tests_hotels_back_chat_fullscreen.mjs && node tests_oracle_fcm.mjs && node tests_response_quality.mjs && node tests_avatar_brand_pronunciation.mjs && node tests_math_linear_equations.mjs && node tests_math_linear_graph_proof.mjs && node tests_math_linear_verification.mjs && node tests_avatar_lipsync_stop.mjs && node tests_avatar_launch_boundaries.mjs && node tests_eva_history_recall.mjs && node tests_eva_context_clarification.mjs && node tests_eva_backend_recall.mjs && node tests_eva_dialogue.mjs && node tests_remote_street_nearby.mjs && node tests_local_multisource_shops.mjs && node tests_fsa_trading_alias.mjs && node tests_retail_categories.mjs && node tests_global_places.mjs && node tests_education_android.mjs && node tests_first_install_profile_search.mjs && node tests_shopping_workspace.mjs && node tests_agenda_android_reminders.mjs && node tests_literature_seven_country_library.mjs && node tests_literature_study_typography_nav.mjs && node tests_literature_grade1_offline.mjs && node tests_literature_ro_grade_progression.mjs && node tests_literature_tutor_response.mjs && node tests_navigation_route_entry_send_center.mjs && node tests_literature_exact_paged_reader.mjs && node tests_seven_europe_literature.mjs && node tests_hungarian_school_paths.mjs
      - name: Verify Tools workspace navigation and fixed header
        run: node tests_extra_tools_header_layout.mjs && node tests_extra_tools_workspace.mjs && node tests_creation_ui.mjs && node tests_creation_site_v2.mjs && node tests_creator_management_and_translation.mjs && node tests_creator_premium_presentations.mjs && node tests_creator_live_ui.mjs && node tests_image_art_style_scrolling.mjs && node tests_creator_preview_worker.mjs
      - name: Verify shared mathematics layout and native Back in paged theory
        run: node tests_math_shared_workspace_layout.mjs && node tests_education_android.mjs
      - name: Verify Sciences subject-year navigation and centered selection cards
        run: node tests_science_navigation.mjs && node tests_science_compact_theory.mjs && node tests_chemistry_three_sections.mjs && node tests_science_year_cards.mjs
      - name: Verify current GPS map, postal code and POI integration
        run: node tests_assistant_live_location.mjs && node tests_assistant_location_map.mjs
      - name: Build debug APK (CI validation only; not a stable update)
        env:
          POCKET_VERSION_CODE: ${{ github.run_number }}
          POCKET_FIREBASE_API_KEY: ${{ vars.POCKET_FIREBASE_API_KEY }}
          POCKET_FIREBASE_APP_ID: ${{ vars.POCKET_FIREBASE_APP_ID }}
          POCKET_FIREBASE_PROJECT_ID: ${{ vars.POCKET_FIREBASE_PROJECT_ID }}
          POCKET_FIREBASE_SENDER_ID: ${{ vars.POCKET_FIREBASE_SENDER_ID }}
        run: gradle -p android --no-daemon assembleDebug
      # Stable, updatable APKs are built separately by
      # build-android-signed-release.yml with the verified keystore/alias.
      # This workflow only validates a debug compile; it must not try signing
      # the same release a second time with a stale POCKET_KEY_ALIAS secret.
      - uses: actions/upload-artifact@v4
        with:
          name: myPocketAI-android-debug-NOT-UPGRADEABLE
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
  signed-branch-preview:
    concurrency:
      group: pocketai-signed-branch-test
      cancel-in-progress: false
    # Manual only; optional prerelease artifact, never a production deployment.
    permissions:
      contents: write
    if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Validate and bundle branch snapshot
        run: |
          node --check index.js
          node tests_android_ui_preview.mjs
          npm run test:transit-reported-failures
          npm run test:mixed-orientation
          node tests_divertisment_frontend_presence.mjs
          node tests_education_source_translation.mjs
          node tests_science_container_translation.mjs
          node tests_practical_courses.mjs
          node tests_practical_workshops.mjs
          node tests_foreign_language_resources.mjs
          node scripts/build_android_ui_preview.mjs
      - name: Check permanent keystore and latest published APK
        env:
          GH_TOKEN: ${{ github.token }}
          POCKET_KEYSTORE_B64: ${{ secrets.POCKET_KEYSTORE_B64 }}
          POCKET_STORE_PASSWORD: ${{ secrets.POCKET_STORE_PASSWORD }}
          POCKET_KEY_PASSWORD: ${{ secrets.POCKET_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$POCKET_KEYSTORE_B64" && test -n "$POCKET_STORE_PASSWORD" && test -n "$POCKET_KEY_PASSWORD" || { echo '::error::Permanent release signing credentials are missing.'; exit 1; }
          KEY="$RUNNER_TEMP/pocket-preview-release.jks"
          printf '%s' "$POCKET_KEYSTORE_B64" | tr -d '[:space:]' | base64 --decode > "$KEY"
          chmod 600 "$KEY"
          test "$(sha256sum "$KEY" | cut -d' ' -f1)" = '4f1c7e49579217c7f9b36847aa78932eabc097c871ac5e4ab0ece9254001aea4' || { echo '::error::Wrong release keystore.'; exit 1; }
          keytool -list -keystore "$KEY" -storepass "$POCKET_STORE_PASSWORD" -alias mypocketai-release >/dev/null 2>&1
          keytool -certreq -keystore "$KEY" -storepass "$POCKET_STORE_PASSWORD" -alias mypocketai-release -keypass "$POCKET_KEY_PASSWORD" -file "$RUNNER_TEMP/check.csr" >/dev/null 2>&1
          rm -f "$RUNNER_TEMP/check.csr"
          mkdir -p "$RUNNER_TEMP/published"
          TAG=$(gh release view --json tagName --jq .tagName)
          gh release download "$TAG" --pattern myPocketAI-signed-release.apk --dir "$RUNNER_TEMP/published"
          APK="$RUNNER_TEMP/published/myPocketAI-signed-release.apk"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          SIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$SIGNER" verify --print-certs "$APK" > "$RUNNER_TEMP/published-cert.txt"
          BADGING=$("$AAPT" dump badging "$APK" | head -1)
          [[ "$BADGING" == *"package: name='ai.mypocket.mobile'"* ]]
          CODE=$(printf '%s' "$BADGING" | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p")
          [[ "$CODE" =~ ^[0-9]+$ ]] && test "$CODE" -lt 2100000000
          echo "Reference release: $TAG, versionCode=$CODE"
          # A user can already have a previous signed test installed. Increment
          # beyond our published test versions too, not just the stable APK.
          MAX_CODE=$CODE
          PREVIEW_NOTES=$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq '.[] | select(.prerelease == true and (.tag_name | startswith("education-test-"))) | .body')
          while read -r PREVIEW_CODE; do
            if [[ "$PREVIEW_CODE" =~ ^[0-9]+$ ]] && test "$PREVIEW_CODE" -gt "$MAX_CODE"; then MAX_CODE=$PREVIEW_CODE; fi
          done < <(printf '%s\n' "$PREVIEW_NOTES" | sed -nE 's/.*(versionCode|APK)[[:space:]]*([0-9]{5,10}).*/\2/p')
          test "$MAX_CODE" -lt 2100000000
          echo "POCKET_VERSION_CODE=$((MAX_CODE + 1))" >> "$GITHUB_ENV"
          echo "POCKET_KEY_ALIAS=mypocketai-release" >> "$GITHUB_ENV"
          echo "POCKET_KEYSTORE_PATH=$KEY" >> "$GITHUB_ENV"
      - name: Build permanent-key signed branch APK
        env:
          POCKET_TOOLS_UI_PREVIEW: 'true'
          POCKET_ALLOW_SIGNED_BRANCH_PREVIEW: 'true'
          POCKET_STORE_PASSWORD: ${{ secrets.POCKET_STORE_PASSWORD }}
          POCKET_KEY_PASSWORD: ${{ secrets.POCKET_KEY_PASSWORD }}
          POCKET_FIREBASE_API_KEY: ${{ vars.POCKET_FIREBASE_API_KEY }}
          POCKET_FIREBASE_APP_ID: ${{ vars.POCKET_FIREBASE_APP_ID }}
          POCKET_FIREBASE_PROJECT_ID: ${{ vars.POCKET_FIREBASE_PROJECT_ID }}
          POCKET_FIREBASE_SENDER_ID: ${{ vars.POCKET_FIREBASE_SENDER_ID }}
        run: gradle -p android --no-daemon assembleRelease
      - name: Verify signing certificate, identity, version and snapshots
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/release/app-release.apk
          SIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$SIGNER" verify --print-certs "$APK" > "$RUNNER_TEMP/preview-cert.txt"
          EXPECTED=$(grep '^Signer #1 certificate SHA-256 digest:' "$RUNNER_TEMP/published-cert.txt")
          ACTUAL=$(grep '^Signer #1 certificate SHA-256 digest:' "$RUNNER_TEMP/preview-cert.txt")
          test -n "$EXPECTED" && test "$EXPECTED" = "$ACTUAL" || { echo '::error::Signing certificate differs from published APK.'; exit 1; }
          "$AAPT" dump badging "$APK" | head -1 | tee "$RUNNER_TEMP/preview-badging.txt"
          grep -F "package: name='ai.mypocket.mobile' versionCode='$POCKET_VERSION_CODE'" "$RUNNER_TEMP/preview-badging.txt"
          unzip -l "$APK" > "$RUNNER_TEMP/preview-files.txt"
          grep -F 'assets/tools-ui-preview.html' "$RUNNER_TEMP/preview-files.txt"
          grep -F 'assets/preview/education/literature/authored/FR/CP.json' "$RUNNER_TEMP/preview-files.txt"
          grep -F 'assets/preview/education/literature/authored/HU/1.json' "$RUNNER_TEMP/preview-files.txt"
          for COURSE in finance trades business digital career daily; do
            grep -F "assets/preview/education/practical/course-v1/$COURSE.json" "$RUNNER_TEMP/preview-files.txt"
          done
          grep -F 'assets/preview/education/languages/resources-v1/en-GB.json' "$RUNNER_TEMP/preview-files.txt"
          test "$(grep -c 'assets/preview/packs/p-.*\.json' "$RUNNER_TEMP/preview-files.txt")" -ge 3496
          cp "$APK" myPocketAI-signed-education-test.apk
          sha256sum myPocketAI-signed-education-test.apk
      - uses: actions/upload-artifact@v4
        with:
          name: myPocketAI-signed-education-test
          path: myPocketAI-signed-education-test.apk
          if-no-files-found: error
          retention-days: 7
      - name: Publish requested signed test APK for direct mobile download
        if: ${{ inputs.publish_signed_apk }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "education-test-${GITHUB_RUN_ID}" myPocketAI-signed-education-test.apk \
            --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "myPocketAI — signed Romania test (${GITHUB_RUN_ID})" \
            --notes "User-requested signed branch-test APK from ${GITHUB_SHA}; versionCode ${POCKET_VERSION_CODE}. Same permanent signing certificate as production, verified during build; installs as an update without uninstalling. Includes local transport reuse at both ends, independent rail/coach/corridor searches, progressive mixed results with selectable early options and preserved detail/Back navigation, and the physical-report walking/latency fixes. Requires backend v187, deployed separately; this build does not deploy a backend. Operator route pages may include changes and are indicative, not a dated booking or guaranteed connection. Real UK–Oradea door-to-door service availability remains for live/physical testing. No new paid services, HERE activation, main merge, Oracle changes or production frontend deployment. Germany HERE is OFF and unverified. Test prerelease, not the latest production release."

      - name: Remove temporary key and reference APK
        if: always()
        run: rm -f "$RUNNER_TEMP/pocket-preview-release.jks" "$RUNNER_TEMP/check.csr" "$RUNNER_TEMP/published/myPocketAI-signed-release.apk"

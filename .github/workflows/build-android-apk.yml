name: Build myPocket AI Android APK
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'android/**'
      - 'index.js'
      - 'backend.js'
      - 'tests_pdf_library_bulk_preview.mjs'
      - '.github/workflows/build-android-apk.yml'
permissions:
  contents: read
jobs:
  apk-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check preinstalled Android SDK
        run: |
          test -d "${ANDROID_HOME:-/usr/local/lib/android/sdk}/platforms" || { echo 'Android SDK platforms missing'; exit 1; }
          echo "SDK directory: ${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          ls "${ANDROID_HOME:-/usr/local/lib/android/sdk}/platforms"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Validate frontend syntax
        run: node --check index.js && node tests_math_linear_equations.mjs && node tests_math_linear_graph_proof.mjs && node tests_math_linear_verification.mjs && node tests_avatar_lipsync_stop.mjs && node tests_education_android.mjs && node tests_shopping_workspace.mjs && node tests_agenda_android_reminders.mjs
      - name: Build debug APK (CI validation only; not a stable update)
        env:
          POCKET_VERSION_CODE: ${{ github.run_number }}
        run: gradle -p android --no-daemon assembleDebug
      # Stable, updatable APKs are built separately by
      # build-android-signed-release.yml with the verified keystore/alias.
      # This workflow only validates a debug compile; it must not try signing
      # the same release a second time with a stale POCKET_KEY_ALIAS secret.
      - uses: actions/upload-artifact@v4
        with:
          name: myPocketAI-android-debug-NOT-UPGRADEABLE
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

name: Pocket AI minimal code checks
on:
  pull_request:
    branches: [main]
    paths:
      - 'backend.js'
      - 'index.js'
      - 'literature_task_ui.mjs'
      - 'tests_literature_activity_flow.mjs'
      - 'tests_education_reader_documents_regression.mjs'
      - 'tests_first_install_consent.mjs'
      - 'android/app/src/main/java/ai/mypocket/mobile/AvatarLaunchActivity.java'
      - 'android/app/src/main/assets/avatar-enter.js'
      - 'tests_pdf_library_bulk_preview.mjs'
      - 'tests_literature_tutor_response.mjs'
      - 'literature_verified_authors.mjs'
      - 'tests_literature_verified_authors.mjs'
      - 'education_theory.mjs'
      - 'chemistry_curriculum.mjs'
      - 'chemistry_advanced.mjs'
      - 'biology_curriculum.mjs'
      - 'foreign_languages_curriculum.mjs'
      - 'foreign_languages_learning.mjs'
      - 'foreign_languages_examples.mjs'
      - 'android/app/src/main/java/ai/mypocket/mobile/MainActivity.java'
      - 'tests_foreign_languages.mjs'
      - 'astronomy_curriculum.mjs'
      - 'astronomy_verified.mjs'
      - 'tests_astronomy_complete.mjs'
      - 'tests_biology_complete.mjs'
      - 'tests_chemistry_complete.mjs'
      - 'tests_chemistry_curriculum.mjs'
      - 'math_advanced_verified.mjs'
      - 'tests_education_theory.mjs'
      - 'tests_education_theory_ui.mjs'
      - 'tests_math_advanced_verified.mjs'
      - 'tests_math_graph_complete.mjs'
      - 'tests_math_input_integrity.mjs'
      - 'localization.mjs'
      - 'news_discovery.mjs'
      - 'news_source_integrity.mjs'
      - 'tests_news_source_integrity.mjs'
      - 'response_intent.mjs'
      - 'tests_response_intent.mjs'
      - 'tests_news_live_routing.mjs'
      - 'news_article_detail.mjs'
      - 'scripts/patch-avatar-lipsync.mjs'
      - 'tests_news_contextual_translation.mjs'
      - 'tests_avatar_lipsync_stop.mjs'
      - 'package.json'
      - 'tests_maps_walk_drive_visibility.mjs'
      - 'tests.mjs'
      - 'tests_routes.mjs'
      - 'tests_address_city_aliases.mjs'
      - 'tests_address_progressive.mjs'
      - 'tests_progressive_selector_policy.mjs'
      - 'tests_mixed_selector_ui.mjs'
      - 'tests_mixed_uk_fallback.mjs'
      - 'tests_navigation_heading.mjs'
      - 'tests_education_responsive_layout.mjs'
      - '.github/workflows/test-generalist-mixed.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript syntax
        run: npm run check
      - name: Maps/Hotels, Education height and multilingual navigation
        run: node tests_module_landing_locales.mjs
      - name: Maps pedestrian and driving route visibility regression
        run: node tests_maps_walk_drive_visibility.mjs
      - name: Quiet petrol route choices and chat-free loading regression
        run: node tests_maps_route_quiet_ui.mjs
      - name: Walking and driving route results avoid chat and retain map Back
        run: node tests_route_choices_no_chat_flow.mjs
      - name: Verify education year, lesson contents and browser boot
        run: node tests_education_content_navigation.mjs
      - name: Confirm current Cloudflare home and Android cache-busting
        run: node tests_android_home_refresh.mjs
          node tests_literature_verified_authors.mjs

      - name: Focused language-and-literature screen regression
        run: node tests_literature_activity_flow.mjs
      - name: Language tutoring response and conditional quiz regression
        run: node tests_literature_tutor_response.mjs
      - name: Education reader and PDF document library regression
        run: node tests_education_reader_documents_regression.mjs
      - name: First-install native consent, Agenda notification and avatar mist
        run: node tests_first_install_consent.mjs
      - name: A4 PDF viewer and bulk document actions
        run: |
          node tests_pdf_library_bulk_preview.mjs
          node tests_pdf_library.mjs
      - name: Android literature level to Grade 8 navigation
        run: node tests_literature_navigation_viewport.mjs
      - name: Country-first Education navigation
        run: node tests_education_country_first.mjs
      - name: UI checks 1-5
        run: |
          node tests_navigation_heading.mjs
          node tests_education_responsive_layout.mjs
          node tests_math_voice_parentheses.mjs
          node tests_math_linear_equations.mjs
          node tests_math_linear_graph_proof.mjs
      - name: UI checks 6-10
        run: |
          node tests_math_linear_verification.mjs
          node tests_math_whisper_pilot.mjs
          node tests_math_quadratic.mjs
          node tests_math_algebra_registry.mjs
          node tests_math_linear_systems.mjs
      - name: UI checks 11-15
        run: |
          node tests_math_systems_3x3.mjs
          node tests_math_3d_planes.mjs
          node tests_math_matrix_symbolic.mjs
          node tests_math_visual_graphs.mjs
          node tests_math_right_triangle.mjs
      - name: UI checks 16-20
        run: |
          node tests_math_plane_shapes.mjs
          node tests_math_text_rectangle.mjs
          node tests_math_graph_corner.mjs
          node tests_math_journey.mjs
          node tests_math_figure_workbench.mjs
      - name: UI checks 21-25
        run: |
          node tests_math_figure_workspace.mjs
          node tests_math_figure_association.mjs
          node tests_math_workspace_escape.mjs
          node tests_math_figure_editor.mjs
          node tests_math_photo_review.mjs
      - name: UI checks 26-30
        run: |
          node tests_math_photo_vision.mjs
          node tests_math_like_terms.mjs
          node tests_math_subject_coverage.mjs
          node tests_education_theory.mjs
          node tests_education_theory_ui.mjs
      - name: UI checks 31-35
        run: |
          node tests_math_advanced_verified.mjs
          node tests_math_graph_complete.mjs
          node tests_math_input_integrity.mjs
          node tests_math_caret_follow.mjs
          node tests_chemistry_curriculum.mjs
      - name: UI checks 36-40
        run: |
          node tests_science_navigation.mjs
          node tests_chemistry_complete.mjs
          node tests_biology_complete.mjs
          node tests_science_scroll_unlock.mjs
          node tests_science_viewport_keyboard.mjs
      - name: UI checks 41-45
        run: |
          node tests_chemistry_visuals.mjs
          node tests_chemistry_atom_context.mjs
          node tests_science_resolution_symbols.mjs
          node tests_physics_complete.mjs
          node tests_astronomy_complete.mjs
      - name: UI checks 46 tests_foreign_languages.mjs
        run: node tests_foreign_languages.mjs
      - name: UI checks 47 tests_history_geography.mjs
        run: node tests_history_geography.mjs
      - name: UI checks 48 tests_education_hg_theory_coverage.mjs
        run: node tests_education_hg_theory_coverage.mjs
      - name: UI checks 49 tests_education_worldwide.mjs
        run: node tests_education_worldwide.mjs
      - name: UI checks 50 tests_literature_offline_theory.mjs
        run: node tests_literature_offline_theory.mjs
      - name: UI checks 51-55
        run: |
          node tests_literature_verified_authors.mjs
          node tests_education_ui_locales.mjs
          node tests_computing_curriculum.mjs
          node tests_computing_full_theory.mjs
          node tests_exam_curriculum_europe.mjs
      - name: UI checks 56-60
        run: |
          node tests_practical_courses.mjs
          node tests_home_einstein_layout.mjs
          node tests_home_pdf_avatar_drive_flow.mjs
          node tests_education_scope_ui.mjs
          node tests_first_install_language_budget_income.mjs
      - name: UI checks 61-65
        run: |
          node tests_culinary_multi_request.mjs
          node tests_conversation_intent.mjs
          node tests_recipe_pagination_relevance.mjs
          node tests_recipe_history_recall.mjs
          node tests_literature_activity_flow.mjs
      - name: Complete publisher recipe regression
        run: npm run test:culinary
      - name: News context translation and avatar lip-stop tests
        run: |
          node tests_localization.mjs
          node tests_news_contextual_translation.mjs
          node tests_response_intent.mjs
          node tests_news_live_routing.mjs
          node tests_address_city_aliases.mjs
          node tests_address_progressive.mjs
          node tests_progressive_selector_policy.mjs
          node tests_mixed_selector_ui.mjs
          node tests_mixed_uk_fallback.mjs
          node tests_news_source_integrity.mjs
          node tests_avatar_lipsync_stop.mjs

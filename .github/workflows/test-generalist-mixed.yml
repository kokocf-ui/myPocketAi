name: Pocket AI minimal code checks
on:
  pull_request:
    branches: [main]
    paths:
      - 'backend.js'
      - 'index.js'
      - 'package.json'
      - 'tests.mjs'
      - 'tests_routes.mjs'
      - 'tests_navigation_heading.mjs'
      - 'tests_education_responsive_layout.mjs'
      - '.github/workflows/test-generalist-mixed.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript syntax
        run: npm run check
      - name: Basic UI integrity
        run: npm run test:ui

name: Pocket AI focused regression
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - backend.js
      - index.js
      - tests_request_pipeline_regression.mjs
      - tests_geographic_station_intent.mjs
      - tests_balmos_recipe_regression.mjs
      - tests_entity_disambiguation.mjs
      - .github/workflows/test-generalist-mixed.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check backend.js
          node --check index.js
      - name: Focused smoke tests
        run: |
          node tests_request_pipeline_regression.mjs
          node tests_geographic_station_intent.mjs
          node tests_balmos_recipe_regression.mjs
          node tests_entity_disambiguation.mjs

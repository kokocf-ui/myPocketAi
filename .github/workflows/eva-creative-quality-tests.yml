name: Eva creative quality - cross-module tests

on:
  push:
    branches:
      - feature/eva-creative-quality-20261119
    paths:
      - 'backend.js'
      - 'eva_creative_quality.mjs'
      - 'eva_ai_orchestrator.mjs'
      - 'tests_eva_creative_quality.mjs'
      - 'tests_eva_creative_backend.mjs'
      - 'tests_eva_ai_backend_routing.mjs'
      - '.github/workflows/eva-creative-quality-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  creative-quality-and-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate sources and cross-module writing quality
        run: |
          node --check backend.js
          node --check eva_creative_quality.mjs
          node --check eva_ai_orchestrator.mjs
          node tests_eva_creative_quality.mjs
          node tests_eva_creative_backend.mjs
          node tests_eva_ai_orchestrator.mjs
          node tests_eva_ai_backend_routing.mjs
          node tests_storybook_generation.mjs
          node tests_storybook_documentary.mjs
          node tests_response_quality.mjs
          node tests_cloudflare_model_retirement.mjs
          node tests_literature_tutor_response.mjs
          node tests_response_intent.mjs
          node tests_eva_dialogue.mjs

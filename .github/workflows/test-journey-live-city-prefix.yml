name: Live journey city-prefix smoke
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/test-journey-live-city-prefix.yml'
      - 'backend.js'
      - 'one_field_journey_ui.mjs'
  workflow_dispatch:
jobs:
  verify-real-geocoder:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check actual Cloudflare address suggestions
        run: |
          node --input-type=module <<'NODE'
          const endpoint='https://lifewise-ai-api.kokocf.workers.dev/api/chat';
          const prefixes=['__street','__canonical','O','Or','Ora','Orade','Oradea'];
          let failed=false;
          for(const prefix of prefixes){
            const text=prefix==='__street'?'Nufărului 1':prefix==='__canonical'?'1 Nufărului':'Nufărului 1, '+prefix;
            const response=await fetch(endpoint,{
              method:'POST',headers:{'Content-Type':'application/json'},
              body:JSON.stringify({journey_suggest:{query:text}}),
              signal:AbortSignal.timeout(25000)
            });
            const data=await response.json().catch(()=>({}));
            const options=[...(Array.isArray(data.completions)?data.completions:[]),
              ...(Array.isArray(data.candidates)?data.candidates:[])];
            const matches=options.filter(p=>/oradea/i.test(String(p.label||'')));
            console.log(JSON.stringify({prefix,http:response.status,
              completionCount:data.completions?.length||0,
              verifiedAddressCount:data.candidates?.length||0,
              exactNumberRequired:data.exact_number_required,
              matches:matches.slice(0,3).map(x=>x.label),
              topResults:options.slice(0,15).map(x=>x.label),
              error:data.error||''}));
            if(!response.ok||(!prefix.startsWith('__')&&!matches.length))failed=true;
          }
          // Diagnostic: compare the existing country-scoped structured city
          // resolver, without guessing a destination in the product.
          for(const query of ['O','Or']){
            const r=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},
              body:JSON.stringify({address_lookup:{stage:'city',country:'ro',city:'',street:'',query,postcode:'',region:''}}),
              signal:AbortSignal.timeout(25000)});
            const result=await r.json().catch(()=>({}));
            console.log(JSON.stringify({structuredCityPrefix:query,http:r.status,
              candidateCount:result.candidates?.length||0,
              topResults:(result.candidates||[]).slice(0,12).map(v=>v.label),error:result.error||''}));
          }
          if(failed){console.log('::error::LIVE PREFIX REGRESSION');process.exit(1)}

          // Live regression checks for bare multi-city POI, station deduplication, and London Victoria Station
          const ukGps={latitude:51.4775,longitude:0.3007};
          const museumRes=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},
            body:JSON.stringify({journey_suggest:{query:'muzeul țării crișurilor',location:ukGps}}),
            signal:AbortSignal.timeout(25000)});
          const museumData=await museumRes.json().catch(()=>({}));
          const museumLabels=(museumData.candidates||[]).map(c=>c.label);
          console.log('::notice title=liveBareMuseum::'+JSON.stringify(museumLabels));

          const garaRes=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},
            body:JSON.stringify({journey_suggest:{query:'gara, Oradea',location:ukGps}}),
            signal:AbortSignal.timeout(25000)});
          const garaData=await garaRes.json().catch(()=>({}));
          const garaLabels=(garaData.candidates||[]).map(c=>c.label);
          const centralaHits=garaLabels.filter(l=>/^gara central[aă],/i.test(l));
          console.log('::notice title=liveGaraOradea::'+JSON.stringify({centralaCount:centralaHits.length,labels:garaLabels}));

          const vicRes=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},
            body:JSON.stringify({journey_suggest:{query:'London Victoria Station',country_code:'GB',location:ukGps}}),
            signal:AbortSignal.timeout(25000)});
          const vicData=await vicRes.json().catch(()=>({}));
          const vicLabels=(vicData.candidates||[]).map(c=>c.label);
          console.log('::notice title=liveLondonVictoria::'+JSON.stringify(vicLabels));

          let regFail=false;
          if(!museumLabels.some(l=>/oradea/i.test(l))||!museumLabels.some(l=>/beiu[sș]/i.test(l))){
            console.log('::error title=museumFail::'+JSON.stringify(museumLabels));
            regFail=true;
          }
          if(centralaHits.length>1){
            console.log('::error title=garaDedupFail::'+JSON.stringify(centralaHits));
            regFail=true;
          }
          if(!vicLabels.some(l=>/victoria/i.test(l)&&/london/i.test(l))){
            console.log('::error title=victoriaFail::'+JSON.stringify(vicLabels));
            regFail=true;
          }
          if(regFail)process.exit(1);
          NODE

name: Test live Oracle VPC connection without deploying Eva
on:
  push:
    branches:
      - feat/gtfs-sqlite-indexed-20261116
    paths:
      - 'oracle-transport-bridge/vpc_probe.mjs'
      - 'oracle-transport-bridge/wrangler-probe.toml'
      - 'oracle-transport-bridge/tests_vpc_probe.mjs'
      - '.github/workflows/oracle-vpc-live-probe.yml'
  workflow_dispatch:

permissions:
  contents: read
jobs:
  private-loopback-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run pure local proof and check syntax
        run: |
          node --check oracle-transport-bridge/vpc_probe.mjs
          node --test oracle-transport-bridge/tests_vpc_probe.mjs
          python3 - <<'PY'
          import tomllib
          from pathlib import Path
          v=tomllib.loads(Path('oracle-transport-bridge/wrangler-probe.toml').read_text())
          assert v['name']=='pocketai-vpc-oracle-probe-devonly'
          assert v['vpc_services'][0]['binding']=='RO_URBAN_VPC'
          assert v['vpc_services'][1]['binding']=='EN_URBAN_VPC'
          assert all(x['remote'] for x in v['vpc_services'])
          print('PASS: local-dev Worker only; bindings point to verified VPC services.')
          PY
      - name: Install Wrangler for development (NOT deploy)
        run: npm install --no-save --ignore-scripts --no-audit --no-fund wrangler@4.162.0
      - name: Check VPC health and auth enforcement from GitHub's LOCAL Wrangler runtime
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::error::Existing GitHub Cloudflare API credentials unavailable"
            exit 1
          fi
          # VPC remote bindings enable calls into Oracle, but Wrangler itself
          # runs ONLY on 127.0.0.1 on the ephemeral CI runner.
          npx --no-install wrangler dev \
            --config oracle-transport-bridge/wrangler-probe.toml \
            --ip 127.0.0.1 --port 8787 --inspector-port 9229 \
            > /tmp/pocket-vpc-dev.log 2>&1 &
          server_pid="$!"
          trap 'kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 20); do
            if ! kill -0 "$server_pid" 2>/dev/null; then
              echo "::error::Local Wrangler failed before request"
              sed -n '1,70p' /tmp/pocket-vpc-dev.log
              exit 1
            fi
            if grep -q 'Ready on http://127.0.0.1:8787' /tmp/pocket-vpc-dev.log; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            echo "::error::Local Wrangler did not start"
            sed -n '1,70p' /tmp/pocket-vpc-dev.log
            exit 1
          fi
          for region in RO GB; do
            status=$(curl -sS --max-time 15 -o "/tmp/probe-$region.json" -w '%{http_code}' "http://127.0.0.1:8787/probe?region=$region")
            python3 - "$region" "$status" <<'PY'
          import sys,json
          region,http=sys.argv[1:]
          with open('/tmp/probe-'+region+'.json') as f: data=json.load(f)
          # The diagnostic returns only the fixed status category,
          # never token values, internal exceptions or user location.
          print(region,'HTTP',http,'diagnostic:',data.get('status'),'VPC error:',data.get('vpc_error','none'),'class:',data.get('error_class','none'),'cause:',data.get('cause_code','none'),'category:',data.get('message_category','none'),'message:',data.get('safe_message','none'))
          assert http=='200' and data.get('status')=='ok', data.get('status')
          assert data.get('vpc_reachable') and data.get('bearer_auth_enforced')
          assert data.get('token_values_verified') is False
          assert data.get('real_journey_verified') is False
          PY
          done
          echo 'PASS: two private VPC Service bindings reach the correct Oracle services.'
          echo 'No production deployment, no Oracle token values used, no API journey search.'

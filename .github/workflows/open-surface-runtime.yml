name: Prove official surface timetable in branch runtime
on:
  workflow_dispatch:
    inputs:
      probe_local:
        description: 'Also use public TfL with branch backend (max 2 local queries) and one deployed domestic Oradea check; no paid/flight search'
        type: boolean
        default: false
        required: false
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test compiler and runtime without providers
        run: |
          python3 tests_open_surface_gtfs.py
          node tests_open_surface_runtime.mjs
      - name: Download official archive and compile bounded index outside Git
        run: |
          PYTHONPATH=scripts python3 -c "import os,pathlib; from inspect_open_surface_gtfs import download; download(pathlib.Path(os.environ['RUNNER_TEMP'])/'official.zip')"
          python3 scripts/build_open_surface_index.py --file "$RUNNER_TEMP/official.zip" --output "$RUNNER_TEMP/surface-index.json"
      - name: Run actual branch timetable and optional ordinary local connectors
        env:
          PROBE_LOCAL: ${{ inputs.probe_local }}
        run: node scripts/prove_open_surface_runtime.mjs "$RUNNER_TEMP/surface-index.json" "$RUNNER_TEMP/runtime-proof.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: open-surface-runtime-proof
          path: |
            ${{ runner.temp }}/runtime-proof.json
            ${{ runner.temp }}/surface-index.json
          retention-days: 7
          if-no-files-found: ignore

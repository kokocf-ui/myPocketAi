name: Deploy Eva Image Studio preview (isolated)

on:
  push:
    branches: [feature/eva-image-studio-20261114]
    paths:
      - 'eva_image_studio_worker.mjs'
      - 'wrangler.eva-image-studio.jsonc'
      - 'tests_eva_image_studio.mjs'
      - '.github/workflows/deploy-eva-image-studio.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eva-image-studio-preview
  cancel-in-progress: false

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and mocked Workers AI tests
        run: |
          node --check eva_image_studio_worker.mjs
          node --test tests_eva_image_studio.mjs
      - name: Check Cloudflare deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" || -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            echo '::error::Cloudflare credentials missing; preview not deployed.'
            exit 1
          fi
      - name: Install Wrangler
        run: npm install --no-save --ignore-scripts --no-audit --no-fund wrangler@latest
      - name: Deploy ONLY the new image studio Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: npx --no-install wrangler deploy --config wrangler.eva-image-studio.jsonc
      - name: Verify image-studio health (no image credits spent)
        run: |
          node --input-type=module -e "
            const url='https://lifewise-ai-image-studio.kokocf.workers.dev/health';
            const r=await fetch(url,{signal:AbortSignal.timeout(20000)});
            const body=await r.text();
            console.log('health status:',r.status,'content type:',r.headers.get('content-type'),'body:',body.slice(0,500));
            let data;try{data=JSON.parse(body)}catch{throw Error('Health endpoint returned HTML instead of JSON')}
            if(!r.ok||data.ok!==true||data.service!=='eva_image_studio'||data.mode!=='capped_preview')
              throw Error('Image studio health did not match expected service');
            console.log('PASS: preview service responds; no image generated');
          "

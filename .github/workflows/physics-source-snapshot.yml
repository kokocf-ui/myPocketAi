name: Physics internal source snapshot for review
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/physics-source-snapshot.yml'
      - 'scripts/physics_source_snapshot_trigger.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: physics-source-snapshot
          path: |
            index.js
            education_country_ui.mjs
            physics_europe_frameworks.mjs
            science_ro_course_plan.mjs
          if-no-files-found: error
          retention-days: 1

name: Mathematics country and school-year acceptance
on:
  pull_request:
    branches: [main]
    paths:
      - 'math_*.mjs'
      - 'tests_math_*.mjs'
      - 'education_country_ui.mjs'
      - 'education_all_country_subject_matrix.mjs'
      - 'index.js'
      - '.github/workflows/math-country-year-acceptance.yml'
  push:
    branches: [main]
    paths:
      - 'math_*.mjs'
      - 'tests_math_*.mjs'
      - 'education_country_ui.mjs'
      - 'education_all_country_subject_matrix.mjs'
      - 'index.js'
      - '.github/workflows/math-country-year-acceptance.yml'
permissions:
  contents: read
jobs:
  mathematics:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate mathematics and country code
        run: |
          node --check index.js
          node --check math_country_year_alignment_2026.mjs
          node --check math_portugal_2026.mjs
          node --check math_italy_framework_2026.mjs
          node --check math_spain_lomloe_2026.mjs
          node --check math_europe_batch_2026.mjs
          node --check math_europe_second_batch_2026.mjs
          node --check tests_math_europe_second_batch_2026.mjs
          node --check tests_math_europe_batch_2026.mjs
          node --check math_early_years_europe.mjs
          node --check math_country_grade_areas.mjs
          node --check math_depth_courses.mjs
          node --check math_depth_primary.mjs
          node --check math_depth_upper.mjs
          node --check math_depth_university.mjs
          node --check math_depth_primary_56.mjs
          node --check math_depth_university_extension.mjs
          node --check math_depth_upper_2026_additions.mjs
          node --check math_depth_university_2026_additions.mjs
          node --check math_depth_upper_companion_2026.mjs
          node --check math_depth_university_companion_2026.mjs
          node --check tests_math_companions_2026.mjs
          node --check tests_math_upper_university_2026.mjs
          node --check math_theorems_ui.mjs
          node --check math_ro5_numeracy.mjs
          node --check math_ro5_fractions.mjs
          node --check math_ro5_geometry.mjs
          node --check math_ro5_curriculum.mjs
          node --check math_curriculum_readiness.mjs
          node --check math_ro6_curriculum.mjs
          node --check math_ro6_data.mjs
          node --check math_ro7_core.mjs
          node --check math_ro7_geometry.mjs
          node --check math_ro8_core.mjs
          node --check math_ro8_geometry.mjs
          node --check math_ro8_statistics.mjs
          node --check math_ro678_curriculum.mjs
          node --check math_england_y6_curriculum.mjs
          node --check math_england_ks4_curriculum.mjs
          node --check math_gcse_tier_policy.mjs
          node --check tests_math_gcse_tiers.mjs
          node --check math_ro_upper_cohort_policy.mjs
          node --check tests_math_ro_upper_cohort_2026.mjs
          node --check tests_math_england_ks4.mjs
          node --check education_country_ui.mjs
          node --check tests_math_real_browser.mjs
      - name: Check country-by-year coverage and theorems
        run: |
          node tests_math_europe_country_alignment_2026.mjs
          node tests_math_portugal_2026.mjs
          node tests_math_italy_framework_2026.mjs
          node tests_math_spain_lomloe_2026.mjs
          node tests_math_europe_batch_2026.mjs
          node tests_math_europe_second_batch_2026.mjs
          node tests_math_all_countries_2026.mjs
          node tests_math_depth_courses.mjs
          node tests_math_upper_university_2026.mjs
          node tests_math_companions_2026.mjs
          node tests_math_ro5_source_alignment.mjs
          node tests_math_curriculum_readiness.mjs
          node tests_math_ro678_country_curriculum.mjs
          node tests_math_england_y6.mjs
          node tests_math_england_ks4.mjs
          node tests_math_gcse_tiers.mjs
          node tests_math_ro_upper_cohort_2026.mjs
          node tests_math_theorems_countries.mjs
          node tests_math_journey.mjs
          node tests_education_country_first.mjs
          node tests_math_subject_coverage.mjs
          node tests_education_theory_ui.mjs
      - name: Verify actual mobile Chromium navigation
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
          node tests_math_real_browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mathematics-mobile-browser-screenshots
          path: math-browser-audit/
          if-no-files-found: warn
          retention-days: 5

name: Pocket AI - tests and live destination diagnostics

on:
  workflow_run:
    workflows:
      - Deploy MyPocketAI to Cloudflare
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout deployed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax validation
        run: npm run check
      - name: Focused destination and local-category regressions
        run: npm run test:destinations && npm run test:local-categories && node tests_landmark_resolution.mjs
      - name: Modal first-tap and travel mode checks
        run: node tests_modal_ui.mjs && node tests_travel_mode_ui.mjs && node tests_transit_refresh.mjs
      - name: Existing regression tests
        run: npm test

  live-destinations:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Probe named destinations and context against deployed backend
        env:
          POCKET_AI_API: https://lifewise-ai-api.kokocf.workers.dev/api/chat
        run: |
          node --input-type=module <<'JS'
          // Diagnostic test position is a fixed public-area fixture in West Thurrock,
          // NOT the user's GPS location. Never print API keys or precise user positions.
          const location={latitude:51.48,longitude:0.28,updatedAt:Date.now()};
          const api=process.env.POCKET_AI_API;
          const cases=[
            {id:'NAME_ONLY',message:'Decathlon'},
            {id:'NAME_AREA',message:'Decathlon Lakeside'},
            {id:'CATEGORY_NAME',message:'Magazin Decathlon'},
            {id:'STATION_INITIAL',message:'Vreau sa ajung in London Liverpool Street'},
            {id:'GEO_WEST_DULWICH',message:'West Dulwich'},
            {id:'STATION_VICTORIA',message:'Victoria station'},
            {id:'STATION_LONDON_VICTORIA',message:'London Victoria station'},
            {id:'CONTROL',message:'Europa, Grays'}
          ];
          async function ask(message,extra={}){
            const body={message,module:'assistant',language:'ro',history:[],location,...extra};
            const response=await fetch(api,{
              method:'POST',headers:{'Content-Type':'application/json'},
              body:JSON.stringify(body),signal:AbortSignal.timeout(45000)
            });
            const raw=await response.text();
            let data={};try{data=JSON.parse(raw)}catch{}
            return {httpStatus:response.status,data};
          }
          let unresolved=0;
          let identified=null;
          let stationPending=null;
          let stationFailure=false;
          let newPlaceFailures=0;
          for(const item of cases){
            try{
              const {httpStatus,data}=await ask(item.message);
              const context=data.route_context;
              const mappedChoices=(Array.isArray(data.destination_candidates)?data.destination_candidates:[])
                .filter(p=>p&&typeof p.label==='string'&&Number.isFinite(p.latitude)&&Number.isFinite(p.longitude));
              const resolved=Boolean(context?.destination)||mappedChoices.length>0;
              const result={
                case:item.id,httpStatus,apiVersion:data.version||null,
                status:data.status||null,
                destinationIdentified:!!context?.destination,
                validLocationChoices:mappedChoices.length,
                needsLocationChoice:!!data.needs_destination_clarification,
                destinationLabel:context?.destination?.label||null,
                needsConfirmation:!!data.needs_travel_confirmation,
                needsMode:!!data.needs_travel_mode,
                lookupStrategy:data.place_lookup?.strategy||null,
                lookupMatched:data.place_lookup?.matched??null,
                providerStatus:{
                  nameFilterHttp:data.place_lookup?.nameFilterHttp??null,
                  nameFilterFeatures:data.place_lookup?.nameFilterFeatures??null,
                  nameFilterMatched:data.place_lookup?.nameFilterMatched??null,
                  nameFilterError:data.place_lookup?.nameFilterError??null,
                  photonHttp:data.place_lookup?.photonHttp??null,
                  photonFeatures:data.place_lookup?.photonFeatures??null,
                  photonMatched:data.place_lookup?.photonMatched??null,
                  photonError:data.place_lookup?.photonError??null,
                  geocodeHttp:data.place_lookup?.geocodeHttp??null,
                  geocodeFeatures:data.place_lookup?.geocodeFeatures??null,
                  overpassHttp:data.place_lookup?.overpassHttp??null,
                  overpassFeatures:data.place_lookup?.overpassFeatures??null,
                  overpassError:data.place_lookup?.overpassError??null,
                  reverseHttp:data.place_lookup?.reverseHttp??null,
                  administrativeAreas:data.place_lookup?.administrativeAreas??null
                },
                destinationCandidates:data.destination_candidates?.length||0,
                responsePreview:String(data.reply||data.error||'').slice(0,160)
              };
              console.log('POCKET_DIAG '+JSON.stringify(result));
              if(item.id.startsWith('GEO_')||item.id.startsWith('STATION_VICTORIA')||
                 item.id==='STATION_LONDON_VICTORIA'){
                const labels=[context?.destination?.label,...mappedChoices.map(p=>p.label)].filter(Boolean);
                const wrongHotel=labels.some(v=>/premier inn|royal victoria|ibis styles/i.test(v));
                const right=item.id==='GEO_WEST_DULWICH'
                  ?labels.some(v=>/west dulwich/i.test(v))
                  :labels.some(v=>/victoria.+station/i.test(v));
                if(!right||wrongHotel){newPlaceFailures++;console.error('LIVE PLACE INTENT FAILURE '+item.id)}
              }
              if(item.id==='NAME_AREA'&&context?.destination)identified=context;
              if(item.id==='STATION_INITIAL')stationPending=context;
              if(['NAME_ONLY','NAME_AREA','CATEGORY_NAME'].includes(item.id)&&!resolved)unresolved++;
            }catch(error){
              console.log('POCKET_DIAG '+JSON.stringify({case:item.id,
                errorType:error?.name||'Error',error:String(error?.message||error).slice(0,120)}));
              if(item.id==='STATION_INITIAL')stationFailure=true;
              else if(['NAME_ONLY','NAME_AREA','CATEGORY_NAME'].includes(item.id))unresolved++;
              else if(item.id.startsWith('GEO_')||item.id.includes('VICTORIA'))newPlaceFailures++;
            }
          }
          if(identified){
            try{
              const {httpStatus,data}=await ask('Transport public',{
                travel_mode:'transit',route_context:identified
              });
              console.log('POCKET_DIAG '+JSON.stringify({
                case:'TRANSIT_CONTINUITY',httpStatus,apiVersion:data.version||null,
                needsDestinationAgain:!!data.needs_destination_clarification,
                transitAvailable:!!data.transit_available,
                transitAlternatives:Array.isArray(data.transit)?data.transit.length:0,
                finalDestinationPoint:!!data.transit_destination_point,
                lastAlightingCoords:!!data.transit?.[0]?.legs?.at(-1)?.arrivalLatLon,
                replyPreview:String(data.reply||'').slice(0,160)
              }));
              const last=[...(data.transit?.[0]?.legs||[])].reverse().find(l=>!/walk|foot|pedestrian/i.test(String(l.mode||''))&&l.arrivalLatLon),final=data.transit_destination_point;
              if(last?.arrivalLatLon&&final?.label){
                const origin={latitude:last.arrivalLatLon.lat,longitude:last.arrivalLatLon.lon,
                  label:last.to||'Transport alighting stop'};
                if([origin.latitude,origin.longitude,final.latitude,final.longitude].every(Number.isFinite)){
                  const {data:walk}=await ask('Pe jos',{
                    route_profile:'walk',route_destination:final,
                    route_context:{profile:'walk',destination_query:final.label,
                      destination:final,origin,pending:null}
                  });
                  console.log('POCKET_DIAG '+JSON.stringify({case:'FINAL_WALK_FROM_ALIGHTING_STOP',
                    routeAvailable:!!walk.route_available,routeDistanceMeters:walk.route?.distanceMeters??null,
                    destinationPreserved:walk.route?.destination?.label===final.label,
                    reason:walk.reason||null,replyPreview:String(walk.reply||'').slice(0,120)}));
                }
              }
            }catch(error){
              console.log('POCKET_DIAG '+JSON.stringify({
                case:'TRANSIT_CONTINUITY',errorType:error?.name||'Error',
                error:String(error?.message||error).slice(0,120)
              }));
            }
          }
          // The named station is intentionally unresolved on the first turn.
          // Selecting public transport must use TfL's verified station record,
          // not request London again or geocode an unrelated street.
          if(stationPending?.destination_query){
            try{
              const {httpStatus,data}=await ask('Transport public',{
                travel_mode:'transit',route_context:stationPending
              });
              console.log('POCKET_DIAG '+JSON.stringify({
                case:'STATION_LIVERPOOL_STREET_TRANSIT',
                httpStatus,apiVersion:data.version||null,
                needsDestinationAgain:!!data.needs_destination_clarification,
                reason:data.reason||null,stationLookup:data.station_lookup||null,
                transitAvailable:!!data.transit_available,
                alternativeCount:Array.isArray(data.transit)?data.transit.length:0,
                replyPreview:String(data.reply||'').slice(0,160)
              }));
              if(data.needs_destination_clarification||data.reason==='destination_not_confidently_resolved')
                stationFailure=true;
            }catch(e){
              stationFailure=true;
              console.log('POCKET_DIAG '+JSON.stringify({case:'STATION_LIVERPOOL_STREET_TRANSIT',
                errorType:e?.name||'Error',message:String(e?.message||e).slice(0,120)}));
            }
          }else{
            stationFailure=true;
            console.error('LIVE STATION CONTINUITY FAILURE: no route context on first turn');
          }
          // Independent local-category diagnostics at a fixed public-area fixture.
          // Never use personal GPS or reveal provider keys.
          const quickCases=[
            {id:'RESTAURANTS',message:'Găsește restaurante în apropierea mea'},
            {id:'CAFES',message:'Găsește cafenele în apropierea mea'},
            {id:'MARKETS',message:'Găsește supermarketuri și magazine alimentare în apropierea mea'}
          ];
          const placeSets={};
          for(const item of quickCases){
            try{
              const {data}=await ask(item.message,{module:'travel',quick_place_search:true});
              const places=Array.isArray(data.places)?data.places:[];
              placeSets[item.id]=new Set(places.map(p=>String(p.name||'').toLowerCase()+
                '::'+Number(p.lat).toFixed(4)+','+Number(p.lon).toFixed(4)));
              console.log('POCKET_LOCAL_DIAG '+JSON.stringify({case:item.id,count:places.length,
                sample:places.slice(0,10).map(p=>({name:p.name,type:p.type})),
                searchOk:!!data.search_ok,provider:data.search_provider||null}));
            }catch(e){
              console.log('POCKET_LOCAL_DIAG '+JSON.stringify({case:item.id,
                errorType:e?.name||'Error'}));
            }
          }
          const foodOverlap=[...(placeSets.RESTAURANTS||[])].filter(x=>placeSets.CAFES?.has(x));
          console.log('POCKET_LOCAL_DIAG '+JSON.stringify({case:'RESTAURANT_CAFE_OVERLAP',
            duplicateCount:foodOverlap.length,duplicateKeys:foodOverlap.slice(0,5)}));
          console.log('POCKET_DIAG_SUMMARY '+JSON.stringify({
            backend:'deployed Cloudflare Worker',unitTests:'separate job',
            nameVariantsNotResolved:unresolved,checkedNameVariants:3,
            londonLiverpoolStreetFailed:stationFailure,geographicStationFailures:newPlaceFailures
          }));
          if(unresolved>0){console.error('LIVE NAMED DESTINATION FAILURE: '+unresolved+'/3');process.exitCode=1}
          if(stationFailure){console.error('LIVE STATION FOLLOWUP FAILURE');process.exitCode=1}
          if(newPlaceFailures>0){console.error('LIVE GEOGRAPHIC/STATION IDENTIFICATION FAILURE: '+newPlaceFailures);process.exitCode=1}
          JS

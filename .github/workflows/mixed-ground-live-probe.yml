name: Probe real international ground transport coverage

on:
  push:
    branches: [main]
    paths: ['.github/workflows/mixed-ground-live-probe.yml']
  workflow_dispatch:
  workflow_run:
    workflows: ['Deploy MyPocketAI to Cloudflare']
    types: [completed]

jobs:
  probe:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Query UK to Romania ground options without flight credits
        run: |
          python3 - <<'PY'
          import json,urllib.request,urllib.error,datetime
          # Public example coordinates only, never the user's actual GPS.
          origin={'latitude':51.475,'longitude':0.325,'label':'Grays, UK','country_code':'GB'}
          dest={'latitude':47.0612,'longitude':21.9473,'label':'Strada Nufărului 1, Oradea, Romania','country_code':'RO'}
          departure=(datetime.datetime.now(datetime.timezone.utc)+datetime.timedelta(days=2)).replace(hour=8,minute=0,second=0,microsecond=0).isoformat().replace('+00:00','Z')
          payload={
           'message':'Transport cu trenul sau autocarul la Oradea','module':'travel','language':'ro',
           'history':[],'mixed_journey':True,'mixed_composition':True,
           'transit_query':dest['label'],'transit_destination':dest,
           'journey_origin':origin,'location':origin,'location_requested':True,
           'travel_mode':'transit','transit_preference':'bus_only',
           'transit_departure_at':departure,'requested_transit_count':8
          }
          u='https://lifewise-ai-v2.kokocf.workers.dev/api/chat'
          request=urllib.request.Request(u,data=json.dumps(payload).encode(),
           headers={'Content-Type':'application/json','Accept':'application/json',
            'User-Agent':'PocketAI-transport-smoke-test'},method='POST')
          try:
           with urllib.request.urlopen(request,timeout=70) as resp:
            body=json.load(resp)
            print('HTTP:',resp.status)
            print('Reason:',body.get('reason'))
            print('Provider statuses:',json.dumps(body.get('provider_status'),ensure_ascii=False)[:1500])
            print('Transit options:',len(body.get('transit') or []))
            print('Operator discovery status:',body.get('operator_discovery_status'))
            print('Operator search summary:',json.dumps(body.get('operator_search_summary'),ensure_ascii=False)[:1200])
            print('Ground operator options:',json.dumps([{k:o.get(k) for k in ('operator','mode','from','to','url','fareFrom','access_transfer_needed','door_to_door_complete')} for o in body.get('operator_options') or []],ensure_ascii=False)[:1700])
            print('Flight candidates:',len(body.get('flight_candidates') or []))
            print('Reply:',str(body.get('reply'))[:500])
          except urllib.error.HTTPError as e:
           print('HTTP ERROR:',e.code,e.read(350).decode(errors='replace'))
           raise
          except Exception as e:
           print('ERROR:',type(e).__name__,str(e)[:350])
           raise
          PY

name: England clustered timetable storage pilot test
on:
  push:
    branches: [feat/gtfs-sqlite-indexed-20261116]
    paths:
      - 'oracle-transport-bridge/pilot-compact-east-anglia.py'
      - 'tests_england_compact_pilot.py'
      - '.github/workflows/england-compact-pilot-ci.yml'
  pull_request:
    paths:
      - 'oracle-transport-bridge/pilot-compact-east-anglia.py'
      - 'tests_england_compact_pilot.py'
      - '.github/workflows/england-compact-pilot-ci.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 -m py_compile oracle-transport-bridge/pilot-compact-east-anglia.py tests_england_compact_pilot.py
          python3 tests_england_compact_pilot.py

name: Oracle Comunicare gateway baseline

on:
  push:
    paths:
      - 'oracle-comunicare/**'
      - '.github/workflows/oracle-comunicare.yml'
  pull_request:
    paths:
      - 'oracle-comunicare/**'
      - '.github/workflows/oracle-comunicare.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test oracle-comunicare/*.test.mjs

name: BODS East Anglia exact ZIP hash probe tests
on:
  push:
    branches: [feat/gtfs-sqlite-indexed-20261116]
    paths:
      - 'oracle-transport-bridge/verify-bods-east-anglia-current.py'
      - 'tests_bods_east_anglia_sha_probe.py'
      - '.github/workflows/bods-east-anglia-sha-probe-ci.yml'
  pull_request:
    paths:
      - 'oracle-transport-bridge/verify-bods-east-anglia-current.py'
      - 'tests_bods_east_anglia_sha_probe.py'
      - '.github/workflows/bods-east-anglia-sha-probe-ci.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 -m py_compile oracle-transport-bridge/verify-bods-east-anglia-current.py tests_bods_east_anglia_sha_probe.py
          python3 -m unittest -v tests_bods_east_anglia_sha_probe

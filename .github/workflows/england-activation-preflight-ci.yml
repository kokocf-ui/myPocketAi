name: England read-only activation preflight checks
on:
  push:
    branches: [feat/gtfs-sqlite-indexed-20261116]
    paths:
      - 'oracle-transport-bridge/preflight-england-compact-activation.py'
      - 'tests_england_activation_preflight.py'
      - '.github/workflows/england-activation-preflight-ci.yml'
  pull_request:
    paths:
      - 'oracle-transport-bridge/preflight-england-compact-activation.py'
      - 'tests_england_activation_preflight.py'
      - '.github/workflows/england-activation-preflight-ci.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 -m py_compile oracle-transport-bridge/preflight-england-compact-activation.py tests_england_activation_preflight.py
          python3 -m unittest -v tests_england_activation_preflight

name: Diagnostic destination API international versus national

on:
  push:
    branches:
      - fix/diagnose-live-journey-gateway-20261117
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Compare public autocomplete requests without secrets
        shell: bash
        run: |
          set -uo pipefail
          URL='https://lifewise-ai-api.kokocf.workers.dev/api/chat'
          for case in international_oradea national_basildon international_basildon; do
            case "$case" in
              international_oradea) payload='{"journey_suggest":{"query":"Nufărului 1, Oradea, România"}}' ;;
              national_basildon) payload='{"journey_suggest":{"query":"Basildon","country_code":"GB"}}' ;;
              international_basildon) payload='{"journey_suggest":{"query":"Basildon"}}' ;;
            esac
            echo "::group::$case"
            rc=0
            curl --silent --show-error --connect-timeout 6 --max-time 18 -X POST "$URL" -H 'Content-Type: application/json' --data "$payload" --output /tmp/response.json --write-out 'http=%{http_code} total=%{time_total}s dns=%{time_namelookup}s connect=%{time_connect}s\n' || rc=$?
            echo "curl_exit=$rc"
            if [ -s /tmp/response.json ]; then
              python3 -c "import json; p=json.load(open('/tmp/response.json')); a=p.get('candidates') or []; print('error='+str(p.get('error',''))[:120]); print('candidate_count='+str(len(a))); print('first_label='+str(a[0].get('label',''))[:140] if a else '')" || true
            fi
            rm -f /tmp/response.json
            echo "::endgroup::"
          done

name: Pocket AI live conversational intent QA

on:
  workflow_run:
    workflows:
      - Deploy MyPocketAI to Cloudflare
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-social-intent:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Test spoken-style acknowledgements against deployed backend
        env:
          POCKET_AI_API: https://lifewise-ai-api.kokocf.workers.dev/api/chat
        run: |
          node --input-type=module <<'JS'
          import assert from "node:assert/strict";
          const history=[
            {role:"user",content:"Salut! Ce mai faci?"},
            {role:"assistant",content:"Salut! Sunt bine. Tu cum te simți?"}
          ];
          const oldRoute={pending:"profile",destination_query:"Sunt bine",
            destination:{label:"Sunt Farm, Tandridge, United Kingdom",
              latitude:51.25,longitude:-0.02}};
          const cases=[
            ["Sunt bine","positive",null],
            ["Bine, mulțumesc","positive",oldRoute],
            ["Nu sunt bine","concern",oldRoute],
            ["Foarte bine, mersi!","positive",null]
          ];
          for(const [message,sentiment,route_context] of cases){
            const response=await fetch(process.env.POCKET_AI_API,{
              method:"POST",headers:{"content-type":"application/json"},
              body:JSON.stringify({message,module:"assistant",language:"ro",history,
                ...(route_context?{route_context}:{}),
                location:{latitude:51.48,longitude:0.28}}),
              signal:AbortSignal.timeout(18000)
            });
            const data=await response.json();
            console.log("POCKET_DIALOGUE_LIVE "+JSON.stringify({
              message,http_status:response.status,status:data.status,
              kind:data.context_diagnostics?.dialogue_intent_kind||null,
              sentiment:data.context_diagnostics?.sentiment||null,
              reply:data.reply?.slice(0,200),has_destination:!!data.route_context?.destination,
              has_route_confirmation:!!data.needs_travel_confirmation
            }));
            assert.equal(response.status,200,message);
            assert.equal(data.status,"success",message);
            assert.equal(data.context_diagnostics?.dialogue_intent_kind,"social_checkin",message);
            assert.equal(data.context_diagnostics?.sentiment,sentiment,message);
            assert.equal(data.web_search_status,"not_needed",message);
            assert.equal(data.conversational_reply,true,message);
            assert.ok(!data.needs_travel_confirmation,message);
            assert.equal(Boolean(data.route_context?.destination),false,message);
            assert.ok(data.reply?.length>8&&data.reply.length<250,message);
          }
          console.log("PASS deployed social intent: no Sunt Farm, no spurious address or route.");
          JS

name: diag-live-packs
on:
  push:
    branches: [arena/430ec340-mypocketai]
    paths: ['.github/workflows/diag-live-packs.yml','scripts/diag_live_packs.mjs']
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: |
          node scripts/diag_live_packs.mjs > out.txt 2>&1 || true
          split -l 3 out.txt part_
          for f in part_*; do msg=$(cut -c1-1500 "$f" | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g'); echo "::notice title=$f::$msg"; done

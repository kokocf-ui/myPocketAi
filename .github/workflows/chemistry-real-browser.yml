name: Chemistry real mobile browser acceptance
on:
  pull_request:
    branches: [main]
    paths:
      - 'chemistry_*.mjs'
      - 'tests_chemistry_*.mjs'
      - 'science_grade_progression.mjs'
      - 'science_ro_course_plan.mjs'
      - 'education_country_ui.mjs'
      - 'index.js'
      - '.github/workflows/chemistry-real-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node tests_chemistry_real_mobile_browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chemistry-real-browser-screenshots
          path: chemistry-browser-audit/
          if-no-files-found: warn
          retention-days: 5

name: Package Eva client-owned backend
on:
  workflow_dispatch:
  push:
    branches:
      - ui/tools-workspaces-unified-2026-11-14
    paths:
      - 'studio_*.mjs'
      - 'tests_studio_service.mjs'
      - 'tests_studio_portal_and_handoff.mjs'
      - 'tests_eva_client_installer.mjs'
      - 'instalare-eva.mjs'
      - 'creator_client_install.mjs'
      - 'creator_guesthouse_gallery.mjs'
      - 'creator_hosting_guide.mjs'
      - 'creator_premium_presentations.mjs'
      - 'wrangler.eva-client.jsonc'
      - 'EVA_INSTALARE_BACKEND_CLIENT.md'
      - 'tools/package_eva_client_backend.mjs'
      - '.github/workflows/eva-client-backend-package.yml'
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout draft branch
        uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify Studio backend and privacy checks (zero AI)
        run: |
          node tests_studio_service.mjs
          node tests_studio_portal_and_handoff.mjs
          node tests_eva_client_installer.mjs
      - name: Create independent client deployment package
        run: node tools/package_eva_client_backend.mjs
      - name: Verify Cloudflare Worker bundles without deploying
        run: |
          cd dist/eva-client-backend
          npx --yes wrangler@latest deploy --dry-run --config wrangler.eva-client.jsonc --outdir ../eva-worker-dryrun
      - name: Zip customer deployment
        run: |
          cd dist
          zip -qr Eva-client-backend.zip eva-client-backend/
      - name: Upload owner-managed backend and Romanian guide
        uses: actions/upload-artifact@v4
        with:
          name: Eva-client-backend-and-guide
          path: dist/Eva-client-backend.zip
          retention-days: 14
          if-no-files-found: error

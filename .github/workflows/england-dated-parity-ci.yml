name: England actual date-specific GTFS slice parity
on:
  push:
    branches: [feat/gtfs-sqlite-indexed-20261116]
    paths:
      - 'oracle-transport-bridge/probe-east-anglia-dated.py'
      - 'tests_england_dated_parity.py'
      - '.github/workflows/england-dated-parity-ci.yml'
  pull_request:
    paths:
      - 'oracle-transport-bridge/probe-east-anglia-dated.py'
      - 'tests_england_dated_parity.py'
      - '.github/workflows/england-dated-parity-ci.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 -m py_compile oracle-transport-bridge/probe-east-anglia-dated.py tests_england_dated_parity.py
          python3 tests_england_dated_parity.py

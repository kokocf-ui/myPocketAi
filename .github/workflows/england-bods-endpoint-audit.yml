name: Audit England BODS regional GTFS endpoints (no full download)
on:
  push:
    branches: [feat/gtfs-sqlite-indexed-20261116]
    paths: ['.github/workflows/england-bods-endpoint-audit.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect-get-magic:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Verify actual GET ZIP signature for nine official England BODS regions
        run: |
          python3 - <<'PY'
          from urllib.request import Request,urlopen
          regions=('east_anglia','east_midlands','north_east','north_west',
            'south_east','south_west','west_midlands','yorkshire','london')
          for region in regions:
              url='https://data.bus-data.dft.gov.uk/timetable/download/gtfs-file/'+region+'/'
              with urlopen(Request(url,headers={
                 'User-Agent':'PocketAI-GTFS-readonly-staging/1.0',
                 'Range':'bytes=0-63'}),timeout=18) as response:
                  prefix=response.read(64)
                  print(region,'http',response.status,'zip_signature',prefix.startswith(b'PK'))
                  if response.status!=200 or not prefix.startswith(b'PK'):
                      raise SystemExit('Official BODS region did not return ZIP: '+region)
          print('PASS: 9 regional BODS GTFS URLs return actual ZIP content')
          PY

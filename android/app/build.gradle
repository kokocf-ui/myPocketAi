plugins { id 'com.android.application' }
android {
    namespace 'ai.mypocket.mobile'
    compileSdk 35
    defaultConfig {
        applicationId 'ai.mypocket.mobile'
        minSdk 26
        targetSdk 35
        // Monotonic per GitHub Actions APK workflow run; local builds may override.
        versionCode Integer.parseInt(System.getenv('POCKET_VERSION_CODE') ?: '1')
        versionName '0.2.' + (System.getenv('POCKET_VERSION_CODE') ?: '0')
    }
    signingConfigs {
        release {
            def keyPath = System.getenv('POCKET_KEYSTORE_PATH')
            if (keyPath && file(keyPath).exists()) {
                storeFile file(keyPath)
                storePassword System.getenv('POCKET_STORE_PASSWORD')
                keyAlias System.getenv('POCKET_KEY_ALIAS')
                keyPassword System.getenv('POCKET_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            if (System.getenv('POCKET_KEYSTORE_PATH')) signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
// ML Kit and AndroidX can pull legacy Kotlin JDK compatibility artifacts.
// Align these with the Kotlin stdlib already selected by Gradle to avoid duplicate classes.
configurations.configureEach {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == 'org.jetbrains.kotlin' &&
            details.requested.name in ['kotlin-stdlib-jdk7', 'kotlin-stdlib-jdk8']) {
            details.useVersion '1.8.22'
            details.because 'Kotlin 1.8 bundles JDK7/JDK8 classes in kotlin-stdlib'
        }
    }
}
dependencies {
    implementation 'androidx.activity:activity:1.9.3'
    implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'com.google.mlkit:text-recognition:16.0.1'
}

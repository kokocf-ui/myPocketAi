plugins { id 'com.android.application' }
android {
    namespace 'ai.mypocket.mobile'
    compileSdk 35
    defaultConfig {
        applicationId 'ai.mypocket.mobile'
        minSdk 26
        targetSdk 35
        // Monotonic per GitHub Actions APK workflow run; local builds may override.
        versionCode Integer.parseInt(System.getenv('POCKET_VERSION_CODE') ?: '1')
        versionName '0.2.' + (System.getenv('POCKET_VERSION_CODE') ?: '0')
    }
    signingConfigs {
        release {
            def keyPath = System.getenv('POCKET_KEYSTORE_PATH')
            if (keyPath && file(keyPath).exists()) {
                storeFile file(keyPath)
                storePassword System.getenv('POCKET_STORE_PASSWORD')
                keyAlias System.getenv('POCKET_KEY_ALIAS')
                keyPassword System.getenv('POCKET_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            if (System.getenv('POCKET_KEYSTORE_PATH')) signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
// ML Kit and AndroidX can pull legacy Kotlin JDK compatibility artifacts.
// Align these with the Kotlin stdlib already selected by Gradle to avoid duplicate classes.
configurations.configureEach {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == 'org.jetbrains.kotlin' &&
            details.requested.name in ['kotlin-stdlib-jdk7', 'kotlin-stdlib-jdk8']) {
            details.useVersion '1.8.22'
            details.because 'Kotlin 1.8 bundles JDK7/JDK8 classes in kotlin-stdlib'
        }
    }
}
dependencies {
    implementation 'androidx.activity:activity:1.9.3'
    implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'com.google.mlkit:text-recognition:16.0.1'
}

// Bundle the exact production 3D avatar within the APK rather than downloading it
// from Cloudflare every time the native app launches.
def pocketAvatarAssetDir = layout.buildDirectory.dir("generated/pocket-avatar-assets")
tasks.register("bundlePocketAvatar", Copy) {
    from(file("$rootDir/../public/avatar-v4.html"))
    into(pocketAvatarAssetDir)
    rename { "avatar-production.html" }
    // Keep the enormous embedded GLB untouched in source. During APK packaging,
    // make the mouth return to rest on the authoritative Android TTS completion.
    doLast {
        def avatarFile = new File(pocketAvatarAssetDir.get().asFile, "avatar-production.html")
        def source = avatarFile.getText("UTF-8")
        def before = "function stopSpeech(){state.speaking=false;state.targetWeights.set(shapes.X);setStatus('Avatar pregătit · repaus');}"
        def after = """function stopSpeech(){
 state.speaking=false;state.wordBoundarySeen=false;state.words=[];state.speechText='';state.wordIndex=0;
 state.targetWeights.set(shapes.X);state.morphWeights.set(shapes.X);
 for(const m of meshes){
  const dict=m.morphTargetDictionary,weights=m.morphTargetInfluences;
  if(!dict||!weights)continue;
  for(let k=0;k<7;k++){const index=dict[names[k]];if(index!==undefined)weights[index]=state.morphWeights[k]}
 }
 setStatus('Avatar pregătit · repaus');
}"""
        if (!source.contains(before)) throw new GradleException("Avatar stopSpeech signature changed: review TTS synchronization patch")
        avatarFile.setText(source.replace(before, after), "UTF-8")
    }
}
android.sourceSets.main.assets.srcDir(pocketAvatarAssetDir)
tasks.matching { it.name == "preBuild" }.configureEach { dependsOn("bundlePocketAvatar") }

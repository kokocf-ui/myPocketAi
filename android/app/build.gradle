plugins { id 'com.android.application' }
android {
    namespace 'ai.mypocket.mobile'
    compileSdk 35
    buildFeatures { buildConfig true }
    defaultConfig {
        applicationId 'ai.mypocket.mobile'
        minSdk 26
        targetSdk 35
        // Monotonic per GitHub Actions APK workflow run; local builds may override.
        versionCode Integer.parseInt(System.getenv('POCKET_VERSION_CODE') ?: '1')
        versionName '0.2.' + (System.getenv('POCKET_VERSION_CODE') ?: '0')
        // Firebase's Android client identifiers are public config, not service secrets.
        // Missing values disable push rather than creating a fake registration.
        buildConfigField 'String', 'FCM_API_KEY', groovy.json.JsonOutput.toJson(System.getenv('POCKET_FIREBASE_API_KEY') ?: '')
        buildConfigField 'String', 'FCM_APP_ID', groovy.json.JsonOutput.toJson(System.getenv('POCKET_FIREBASE_APP_ID') ?: '')
        buildConfigField 'String', 'FCM_PROJECT_ID', groovy.json.JsonOutput.toJson(System.getenv('POCKET_FIREBASE_PROJECT_ID') ?: '')
        buildConfigField 'String', 'FCM_SENDER_ID', groovy.json.JsonOutput.toJson(System.getenv('POCKET_FIREBASE_SENDER_ID') ?: '')
        // Branch-only signed UI preview: keep production APK remote-web behavior unchanged.
        buildConfigField 'boolean', 'TOOLS_UI_PREVIEW', (System.getenv('POCKET_TOOLS_UI_PREVIEW') == 'true' ? 'true' : 'false')

    }
    signingConfigs {
        release {
            def keyPath = System.getenv('POCKET_KEYSTORE_PATH')
            if (keyPath && file(keyPath).exists()) {
                storeFile file(keyPath)
                storePassword System.getenv('POCKET_STORE_PASSWORD')
                keyAlias System.getenv('POCKET_KEY_ALIAS')
                keyPassword System.getenv('POCKET_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            if (System.getenv('POCKET_KEYSTORE_PATH')) signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
// ML Kit and AndroidX can pull legacy Kotlin JDK compatibility artifacts.
// Align these with the Kotlin stdlib already selected by Gradle to avoid duplicate classes.
configurations.configureEach {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == 'org.jetbrains.kotlin' &&
            details.requested.name in ['kotlin-stdlib-jdk7', 'kotlin-stdlib-jdk8']) {
            details.useVersion '1.8.22'
            details.because 'Kotlin 1.8 bundles JDK7/JDK8 classes in kotlin-stdlib'
        }
    }
}
dependencies {
    implementation 'androidx.activity:activity:1.9.3'
    implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    implementation platform('com.google.firebase:firebase-bom:35.1.0')
    implementation 'com.google.firebase:firebase-messaging'

}

// Bundle the exact production 3D avatar within the APK rather than downloading it
// from Cloudflare every time the native app launches.
def pocketAvatarAssetDir = layout.buildDirectory.dir("generated/pocket-avatar-assets")
tasks.register("bundlePocketAvatar", Copy) {
    from(file("$rootDir/../public/avatar-v4.html"))
    into(pocketAvatarAssetDir)
    rename { "avatar-production.html" }
    // One shared Node patch is used by Android and Cloudflare so they
    // render identical TTS mouth-stop behavior, without changing the GLB.
    doLast {
        def avatarFile = new File(pocketAvatarAssetDir.get().asFile, "avatar-production.html")
        def patcher = new File(rootDir, "../scripts/patch-avatar-lipsync.mjs")
        if (!avatarFile.isFile() || !patcher.isFile())
            throw new GradleException("Missing avatar or shared mouth patch")
        def process = new ProcessBuilder("node", patcher.absolutePath, avatarFile.absolutePath)
            .redirectErrorStream(true).start()
        def output = process.inputStream.getText("UTF-8")
        if (process.waitFor() != 0)
            throw new GradleException("Avatar lip-sync patch failed: " + output)
        println output.trim()
    }
}
android.sourceSets.main.assets.srcDir(pocketAvatarAssetDir)
tasks.matching { it.name == "preBuild" }.configureEach { dependsOn("bundlePocketAvatar") }

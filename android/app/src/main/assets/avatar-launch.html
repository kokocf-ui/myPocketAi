<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>myPocketAI — apariția avatarului</title>
<style>
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;padding:0;overflow:hidden;background:transparent!important}
body{touch-action:none;-webkit-tap-highlight-color:transparent}
#stage{position:fixed;inset:0;overflow:hidden;pointer-events:none;background:transparent!important}
#avatar{position:absolute;left:10%;top:13%;width:80%;height:73%;border:0;
 background:transparent!important;opacity:0;transform:translateY(26px) scale(.87);
 filter:blur(19px) brightness(.62);clip-path:circle(14% at 50% 52%);
 /* Fade the composited iframe edges even on WebView builds that paint
    the WebGL document's pixels opaquely. No visible rectangular tile. */
 -webkit-mask-image:radial-gradient(ellipse 64% 66% at 50% 53%,
   #000 0%,#000 32%,rgba(0,0,0,.98) 43%,rgba(0,0,0,.87) 56%,
   rgba(0,0,0,.44) 73%,transparent 92%);
 mask-image:radial-gradient(ellipse 64% 66% at 50% 53%,
   #000 0%,#000 32%,rgba(0,0,0,.98) 43%,rgba(0,0,0,.87) 56%,
   rgba(0,0,0,.44) 73%,transparent 92%);
 transition:opacity 1.9s ease,transform 2.15s cubic-bezier(.16,.74,.19,1),
 filter 1.9s ease,clip-path 2.05s cubic-bezier(.19,.7,.19,1);will-change:opacity,transform,filter}
#stage.materializing #avatar{opacity:1;transform:translateY(0) scale(1);
 filter:blur(0) brightness(1);clip-path:circle(110% at 50% 52%)}
#mist{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;opacity:1}
#stage.departing{transition:opacity .45s ease;opacity:0}
@media(prefers-reduced-motion:reduce){
 #avatar{transition:opacity .7s ease!important;transform:none!important;filter:none!important;clip-path:none!important}
}
</style>
</head>
<body>
<div id="stage">
 <iframe id="avatar" src="./avatar-production.html?embedded=1" title="Avatarul 3D Pocket AI" allow="autoplay" aria-hidden="true"></iframe>
 <canvas id="mist" aria-hidden="true"></canvas>
</div>
<script>
(()=>{
'use strict';
const frame=document.getElementById('avatar'),stage=document.getElementById('stage'),canvas=document.getElementById('mist');
const context=canvas.getContext('2d',{alpha:true});
let ready=false,readyAt=0,done=false,width=0,height=0,ratio=1;
let seed=5139;
const rnd=()=>{seed=(1664525*seed+1013904223)>>>0;return seed/4294967296};
const particles=Array.from({length:145},()=>({angle:rnd()*Math.PI*2,rad:rnd(),size:1.3+rnd()*5.4,phase:rnd()*6.28,speed:.38+rnd()*.75,alpha:.26+rnd()*.64}));
function resize(){
 ratio=Math.min(window.devicePixelRatio||1,2);width=window.innerWidth;height=window.innerHeight;
 canvas.width=Math.round(width*ratio);canvas.height=Math.round(height*ratio);
 context.setTransform(ratio,0,0,ratio,0,0);
}
resize();window.addEventListener('resize',resize);
function animate(now){
 if(done||!context)return;
 context.clearRect(0,0,width,height);
 const t=ready?Math.max(0,(now-readyAt)/1000):0;
 const burst=ready?Math.min(1,t/1.9):.05;
 const cloud=ready?Math.max(0,1-t/2.65):.16;
 const originX=width*.5,originY=height*.58;
 for(const p of particles){
  const spread=(.09+p.rad*.24+burst*(.09+p.speed*.21));
  const x=originX+Math.cos(p.angle)*width*spread+Math.sin(t*1.6+p.phase)*6;
  const y=originY+Math.sin(p.angle)*(height*.29)*(.4+p.rad+burst*.8)-t*14*p.speed;
  const a=p.alpha*cloud*(.66+.34*Math.sin(t*2+p.phase)**2);
  const r=p.size*(1+burst*(.75+p.rad));
  const glow=context.createRadialGradient(x,y,0,x,y,r*3.8);
  glow.addColorStop(0,'rgba(126,235,250,'+Math.min(.86,a)+')');
  glow.addColorStop(.26,'rgba(26,183,229,'+Math.min(.4,a*.36)+')');
  glow.addColorStop(1,'rgba(22,159,203,0)');
  context.fillStyle=glow;context.beginPath();context.arc(x,y,r*3.8,0,Math.PI*2);context.fill();
 }
 requestAnimationFrame(animate);
}
requestAnimationFrame(animate);
function nativeMessage(message){
 try{window.PocketAvatarLaunch?.postMessage?.(message)}catch(_){}
}
function api(action,text){
 try{
  const avatar=frame.contentWindow.PocketAvatarAPI;
  if(!avatar)return;
  if(action==='show')avatar.setVisible(true);
  else if(action==='start')avatar.start(text);
  else if(action==='stop')avatar.stop();
 }catch(_){}
}

/** Local launch-only transparency repair for the nested Three.js document.
 * The wallpaper shows through the Activity and WebView, but the child HTML
 * may still paint a solid CSS backdrop even with scene.background=null.
 * Same-origin APK assets let us clear that backdrop without touching the
 * approved 3D model or its renderer/lip-sync controls.
 */
function makeAvatarDocumentTransparent(){
 let child;
 try{child=frame.contentDocument}catch(_){return false}
 if(!child||!child.documentElement)return false;
 const root=child.documentElement;
 if(!child.getElementById('pocket-android-alpha-fix')){
  const style=child.createElement('style');style.id='pocket-android-alpha-fix';
  style.textContent= [
   'html,body{background:transparent!important;background-color:transparent!important;background-image:none!important;}',
   'html::before,html::after,body::before,body::after{background:transparent!important;background-image:none!important;}',
   'canvas{background:transparent!important;background-color:transparent!important;}'
  ].join('');
  (child.head||root).appendChild(style);
 }
 // The canvas wrapper is frequently what makes the full iframe black:
 // remove only CSS backdrops, keeping actual 3D material colours intact.
 const canvases=child.querySelectorAll('canvas');
 canvases.forEach(canvas=>{
  for(let el=canvas;el&&el.nodeType===1;el=el.parentElement){
   el.style.setProperty('background','transparent','important');
   el.style.setProperty('background-color','transparent','important');
   el.style.setProperty('background-image','none','important');
  }
 });
 if(!canvases.length){
  root.style.setProperty('background','transparent','important');
  if(child.body)child.body.style.setProperty('background','transparent','important');
 }
 return true;
}
frame.addEventListener('load',()=>makeAvatarDocumentTransparent());

window.addEventListener('message',event=>{
 if(event.origin!==location.origin||event.source!==frame.contentWindow)return;
 if(event.data?.channel!=='pocket-avatar-v4')return;
 if(event.data.action==='error'){nativeMessage('error');return}
 if(event.data.action!=='ready'||ready)return;
 ready=true;readyAt=performance.now();makeAvatarDocumentTransparent();api('show');
 requestAnimationFrame(()=>requestAnimationFrame(()=>stage.classList.add('materializing')));
 nativeMessage('ready');
});
window.pocketLaunchSpeak=(speaking,text)=>{
 if(speaking)api('start',text||'Salut!');
 else api('stop');
};
window.pocketLaunchFinish=()=>{stage.classList.add('departing');done=true};
})();
</script>
</body>
</html>

# Optional overlay. Use this only AFTER the Firebase project exists and the
# service account JSON is stored on Oracle, outside GitHub and outside .env.
# Existing Caddy/port 8767 and Postgres volume remain untouched.
services:
  api:
    environment:
      FCM_PROJECT_ID: ${FCM_PROJECT_ID:?Set Firebase project ID in Oracle .env}
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/pocket-fcm.json
    volumes:
      - type: bind
        source: ${FCM_CREDENTIALS_HOST_PATH:?Set absolute Oracle credential path in .env}
        target: /run/secrets/pocket-fcm.json
        read_only: true

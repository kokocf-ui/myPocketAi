services:
  urban:
    build:
      context: ..
      dockerfile: oracle-romania-transport/Dockerfile
    image: pocketai-romania-urban:local
    container_name: pocketai-romania-urban
    user: "10001:10001"
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 80
    mem_limit: 1g
    env_file:
      - .env
    volumes:
      - /home/ubuntu/pocketai-romania/feeds:/data/feeds:ro
    ports:
      - "127.0.0.1:8766:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

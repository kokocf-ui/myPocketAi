services:
  database:
    image: postgres:16-alpine
    container_name: pocketai-comunicare-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PGDATABASE:-pocket_comm}
      POSTGRES_USER: ${PGUSER:-pocket_comm}
      POSTGRES_PASSWORD: ${PGPASSWORD:?Set PGPASSWORD in .env}
    volumes:
      - comm_pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 12
    security_opt:
      - no-new-privileges:true
    mem_limit: 384m
  gateway:
    build: .
    image: pocketai-comunicare-gateway:local
    container_name: pocketai-comunicare-gateway
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 256m
    env_file: .env
    environment:
      PGHOST: database
      PORT: "3000"
    ports:
      - "127.0.0.1:8765:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/readyz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 25s
      retries: 3
volumes:
  comm_pgdata:


name = "lifewise-ai-api"
main = "backend.js"
compatibility_date = "2026-10-28"

# Supplement sparse food results worldwide without a paid Places API.
# Uses bounded, area-cached public OSM queries. Disable for large-scale traffic.
[vars]
# Owner-approved transit fixes only. HERE stays OFF; no provider requests authorized here.
HERE_TRANSIT_ENABLED = "false"
# Owner approved commercial terms and FI/EE activation on 2026-11-26. Key stays a Worker Secret.
DIGITRANSIT_NATIONAL_ENABLED = "true"
DIGITRANSIT_TERMS_REVIEWED = "true"
# Explicit-consent handwriting transcription; bounded image, one model, no storage.
POCKET_EDUCATION_INK_ENABLED = "true"
OSM_WORLD_FOOD_ENABLED = "true"
# GPS is the sole implicit anchor; national providers are scoped through the common registry.
SMART_COUNTRY_REGISTRY_ENABLED = "true"
# Owner-authorized free-flight discovery pilot; no paid plan fallback.
SERPAPI_FLIGHTS_PILOT_ENABLED = "true"
SERPAPI_FLIGHTS_TERMS_REVIEWED = "true"

[ai]
binding = "AI"

# Keep the deployed SQLite namespace. Oracle communication may be used separately.
[[durable_objects.bindings]]
name = "POCKET_COMM_HUB"
class_name = "PocketCommunicationHub"

[[migrations]]
tag = "communication-sqlite-v1"
new_sqlite_classes = ["PocketCommunicationHub"]

# Inactive HERE infrastructure only; provider is explicitly OFF above. No key in this file.
# Separate persistent singleton; existing communication namespace is unchanged.
[[durable_objects.bindings]]
name = "HERE_TRANSIT_BUDGET"
class_name = "HereTransitBudget"

[[migrations]]
tag = "here-transit-budget-v1"
new_sqlite_classes = ["HereTransitBudget"]

[[vpc_services]]
binding = "EN_URBAN_VPC"
service_id = "01a1e3ea-f6fa-7d11-8f85-21f267b1d833"
remote = true
[[vpc_services]]
binding = "RO_URBAN_VPC"
service_id = "01a1e3e9-9c6b-7aa1-aefc-50a6824dbcd5"
remote = true

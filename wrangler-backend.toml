
name = "lifewise-ai-api"
main = "backend.js"
compatibility_date = "2026-10-28"

# Supplement sparse food results worldwide without a paid Places API.
# Uses bounded, area-cached public OSM queries. Disable for large-scale traffic.
[vars]
OSM_WORLD_FOOD_ENABLED = "true"
# GPS is the sole implicit anchor; national providers are scoped through the common registry.
SMART_COUNTRY_REGISTRY_ENABLED = "true"

[ai]
binding = "AI"

# Keep the deployed SQLite namespace. Oracle communication may be used separately.
[[durable_objects.bindings]]
name = "POCKET_COMM_HUB"
class_name = "PocketCommunicationHub"

[[migrations]]
tag = "communication-sqlite-v1"
new_sqlite_classes = ["PocketCommunicationHub"]
